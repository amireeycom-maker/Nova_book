<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta name="google-site-verification" content="VuYDlbE9TR30ydqX3WH-VhwgdAWwkc38WqOTFy9lRR0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Book 7.2 — 3D Edition</title>
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: local('Vazirmatn'), local('Vazir'), local('IRANSansWeb');
  }
  :root{
    --bg:#0f1419;
    --panel:#171f28;
    --panel2:#1e2830;
    --line:rgba(238,242,245,0.09);
    --ink:#eef2f5;
    --ink-dim:#93a5b3;
    --amber:#e6b34d;
    --teal:#49b3a6;
    --rose:#c1517d;
    --sky:#5f97c9;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(95,151,201,0.10), transparent 55%),
      radial-gradient(ellipse at 100% 10%, rgba(230,179,77,0.07), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn','IRANSansWeb',Tahoma,'Segoe UI',sans-serif;
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:22px 14px 40px;
  }
  .app-shell{
    width:100%;
    max-width:720px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 2px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark{
    width:38px;height:38px;flex:none;
  }
  .brand h1{
    font-size:17px;
    margin:0;
    font-weight:700;
    letter-spacing:.2px;
  }
  .brand span{
    display:block;
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .back-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:8px 14px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background .15s, transform .1s;
  }
  .back-btn:hover{background:#25313c;}
  .back-btn:active{transform:scale(.97);}
  .back-btn svg{width:14px;height:14px;}

  #app{position:relative;}
  .screen{
    animation:rise .28s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .screen{animation:none;}
  }

  /* ---------- home grid ---------- */
  .hero{
    background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 22px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero:before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:.35;
    mask-image:radial-gradient(circle at 100% 0%, black, transparent 70%);
  }
  .hero h2{
    position:relative;
    font-size:20px;
    margin:0 0 6px;
    font-weight:700;
  }
  .hero p{
    position:relative;
    margin:0;
    color:var(--ink-dim);
    font-size:13.5px;
    line-height:1.9;
    max-width:46ch;
  }

  .menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .menu-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 16px;
    text-align:right;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-start;
    transition:border-color .15s, transform .12s, background .15s;
    font-family:inherit;
    color:var(--ink);
  }
  .menu-card:hover{border-color:rgba(238,242,245,0.22); background:var(--panel2);}
  .menu-card:active{transform:scale(.98);}
  .menu-card .icon{width:34px;height:34px;}
  .menu-card b{font-size:14.5px; font-weight:700;}
  .menu-card small{font-size:11.5px; color:var(--ink-dim); line-height:1.6;}

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .cat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-inline-start:3px solid var(--accent, var(--line));
    border-radius:12px;
    padding:14px 14px 14px 12px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    text-align:right;
    font-family:inherit;
    color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
  }
  .cat-card:hover{border-color:rgba(238,242,245,0.22); background:var(--panel2);}
  .cat-card:hover{border-inline-start-color:var(--accent, var(--line));}
  .cat-card:active{transform:scale(.98);}
  .cat-card .icon{width:24px;height:24px;flex:none; margin-top:1px;}
  .cat-card .catbody{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .cat-card b{font-size:13.5px; line-height:1.3;}
  .cat-card small{font-size:11px; color:var(--ink-dim); line-height:1.6;}

  .section-title{
    font-size:13px;
    font-weight:700;
    margin:22px 2px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--ink-dim);
    letter-spacing:.2px;
  }
  .section-title:first-child{margin-top:0;}
  .section-title:before{
    content:"";
    width:5px;height:5px;
    border-radius:50%;
    background:var(--accent,var(--sky));
    flex:none;
  }

  /* ---------- panel / form controls ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
  }
  .panel-title{
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
  }
  .panel-sub{
    font-size:12.5px;
    color:var(--ink-dim);
    margin:0 0 18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:11px 12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--sky);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

  .shape-picker{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .shape-chip{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:8px 14px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
    font-family:inherit;
    transition:all .15s;
  }
  .shape-chip.active{
    background:rgba(95,151,201,0.16);
    border-color:var(--sky);
    color:var(--ink);
  }

  .solve-btn{
    width:100%;
    background:linear-gradient(135deg,var(--sky),#4a7fb0);
    color:#fff;
    border:none;
    border-radius:11px;
    padding:13px;
    font-size:14.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:filter .15s, transform .1s;
    margin-top:4px;
  }
  .solve-btn:hover{filter:brightness(1.08);}
  .solve-btn:active{transform:scale(.985);}

  .result-box{
    margin-top:16px;
    border-top:1px dashed var(--line);
    padding-top:16px;
    animation:rise .25s ease both;
  }
  .result-box .rlabel{
    font-size:11.5px;
    color:var(--ink-dim);
    margin-bottom:4px;
  }
  .result-box .rvalue{
    font-size:24px;
    font-weight:700;
    color:var(--amber);
    direction:ltr;
    text-align:right;
    unicode-bidi:plain-text;
  }
  .result-box .rformula{
    font-size:12.5px;
    color:var(--ink-dim);
    margin-top:8px;
    line-height:1.9;
    direction:ltr;
    text-align:right;
    unicode-bidi:plain-text;
  }
  .rerror{color:var(--rose); font-size:13px; margin-top:14px;}

  /* ---------- multi-operand number rows ---------- */
  .num-rows{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .num-row{display:flex; align-items:center; gap:8px;}
  .num-row input{flex:1;}
  .num-row .op-badge{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; font-size:13px; color:var(--ink-dim);
  }
  .icon-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; cursor:pointer; color:var(--ink-dim);
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:#2a3540; color:var(--ink);}
  .icon-btn svg{width:14px;height:14px;}
  .add-row-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; background:var(--panel2); border:1px dashed var(--line);
    color:var(--ink-dim); border-radius:10px; padding:9px;
    font-family:inherit; font-size:12.5px; cursor:pointer; margin-bottom:14px;
    transition:background .15s, color .15s;
  }
  .add-row-btn:hover{background:#232e38; color:var(--ink);}
  .add-row-btn svg{width:13px;height:13px;}

  /* ---------- word problem ---------- */
  .word-textarea{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    min-height:110px;
    resize:vertical;
    outline:none;
    line-height:1.9;
  }
  .word-textarea:focus{border-color:var(--sky);}
  .steps-list{
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .steps-list .step{
    font-size:12.5px;
    color:var(--ink-dim);
    direction:ltr;
    text-align:right;
    unicode-bidi:plain-text;
  }

  /* ---------- method blocks (GCD/LCM step-by-step) ---------- */
  .method-block{
    margin-top:18px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .method-block h4{
    font-size:13.5px;
    color:var(--amber);
    margin:0 0 8px;
    font-weight:700;
  }
  .method-note{
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.9;
    margin-bottom:10px;
  }
  .ladder-box{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .ladder-row{
    display:grid;
    grid-template-columns:34px 1fr 1fr;
    gap:8px;
    align-items:center;
    padding:5px 0;
    font-size:13.5px;
    direction:ltr;
  }
  .ladder-row.head{
    color:var(--ink-dim);
    font-size:11.5px;
    border-bottom:1px solid var(--line);
    padding-bottom:7px;
    margin-bottom:3px;
  }
  .ladder-row .lp{
    width:30px;
    text-align:center;
    color:var(--amber);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2px 0;
    font-size:12.5px;
    font-weight:700;
  }
  .ladder-row span:not(.lp){text-align:center;}
  .ladder-row.final{
    border-top:1px dashed var(--line);
    margin-top:4px;
    padding-top:8px;
    color:var(--ink-dim);
    font-size:12px;
  }
  .tree-fact{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:6px;
    font-size:14px;
    direction:ltr;
    text-align:right;
    unicode-bidi:plain-text;
  }
  .list-box{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .list-box .list-title{font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; direction:ltr; justify-content:flex-end;}
  .chip-row .chip{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:7px;
    padding:3px 8px;
    font-size:12.5px;
  }
  .chip-row .chip.hit{
    background:rgba(230,179,77,0.16);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:700;
  }
  .divis-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:7px;
  }
  .divis-row .dv-rule{font-size:12.5px; color:var(--ink-dim); flex:1;}
  .divis-row .dv-badge{
    flex:none;
    font-size:12px;
    font-weight:700;
    border-radius:7px;
    padding:4px 10px;
  }
  .divis-row .dv-badge.yes{background:rgba(73,179,166,0.18); color:var(--teal);}
  .divis-row .dv-badge.no{background:rgba(193,81,125,0.14); color:var(--rose);}

  /* ---------- chat ---------- */
  .chat-wrap{
    background:
      radial-gradient(circle at 10% 10%, rgba(238,242,245,0.03) 1px, transparent 1.4px);
    background-size:16px 16px;
    background-color:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    height:62vh;
    min-height:400px;
    overflow:hidden;
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.8;
    animation:rise .2s ease both;
  }
  .bubble.bot{
    align-self:flex-start;
    background:var(--panel2);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.me{
    align-self:flex-end;
    background:linear-gradient(135deg,var(--sky),#4a7fb0);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .mood-ic{display:inline-flex; width:15px; height:15px; vertical-align:-3px; margin:0 2px;}
  .mood-ic svg{width:100%; height:100%;}
  .chat-input-bar{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .chat-input-bar input{
    flex:1;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:11px;
    padding:11px 14px;
    font-family:inherit;
    font-size:14px;
    outline:none;
  }
  .chat-input-bar input:focus{border-color:var(--sky);}
  .chat-send{
    background:var(--amber);
    border:none;
    color:#20180a;
    border-radius:11px;
    width:44px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:filter .15s, transform .1s;
  }
  .chat-send:hover{filter:brightness(1.06);}
  .chat-send:active{transform:scale(.94);}
  .chat-send svg{width:18px;height:18px; transform:scaleX(-1);}

  footer.note{
    text-align:center;
    color:var(--ink-dim);
    font-size:11px;
    margin-top:22px;
    line-height:1.9;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--panel2); border-radius:8px;}

  /* ---------- scientific calculator ---------- */
  .sci-display{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 14px;
    margin-bottom:12px;
    text-align:left;
    direction:ltr;
    overflow-x:auto;
  }
  .sci-display .expr{font-size:12.5px; color:var(--ink-dim); min-height:16px; white-space:nowrap;}
  .sci-display .val{font-size:26px; font-weight:700; color:var(--ink); margin-top:4px; white-space:nowrap;}
  .sci-mem-badge{font-size:10.5px; color:var(--amber); margin-inline-end:6px;}
  .sci-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
  .sci-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:12px 0;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
    transition:background .12s, transform .08s;
    direction:ltr;
  }
  .sci-btn:hover{background:#26313c;}
  .sci-btn:active{transform:scale(.94);}
  .sci-btn.op{color:var(--sky); font-weight:700;}
  .sci-btn.fn{color:var(--teal); font-size:11.5px;}
  .sci-btn.eq{background:linear-gradient(135deg,var(--sky),#4a7fb0); color:#fff; border:none; font-weight:700;}
  .sci-btn.clear{color:var(--rose);}
  .sci-btn.mem{color:var(--amber); font-size:11.5px;}

  /* ---------- vocabulary / language ---------- */
  .vocab-search{width:100%; margin-bottom:10px;}
  .vocab-count{font-size:11.5px; color:var(--ink-dim); margin-bottom:10px;}
  .vocab-list{max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .vocab-row{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px;}
  .vocab-row .w{direction:ltr; text-align:left; font-weight:700; font-size:13.5px; white-space:nowrap;}
  .vocab-row .t{color:var(--ink-dim); font-size:12px; text-align:right;}
  .idiom-row{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:7px;}
  .idiom-row .ph{font-weight:700; font-size:13.5px; margin-bottom:3px;}
  .idiom-row .mn{color:var(--ink-dim); font-size:12px; line-height:1.7;}

  .history-grid,.religion-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .history-card,.religion-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}
  .history-card b,.religion-card b{display:block;font-size:13.5px;margin-bottom:5px}
  .history-card small,.religion-card small{color:var(--ink-dim);font-size:11px;line-height:1.7}
  .detail{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px}
  .detail h3{margin:0 0 7px;font-size:15px}.detail p{margin:0;color:var(--ink-dim);font-size:12.5px;line-height:2}
  .timeline{border-inline-start:2px solid var(--sky);padding-inline-start:13px}
  .timeline-item{margin-bottom:12px}.timeline-item b{font-size:13px}.timeline-item div{font-size:12px;color:var(--ink-dim);line-height:1.8}
  .scientific-note{color:var(--ink-dim);font-size:11.5px;line-height:1.8;margin-top:8px}

/* Nova Book 6.0 — SVG colors are embedded directly in each icon */
.icon svg { overflow:visible; }

/* ===== Nova Book 6.0: History/Religion media + Geography ===== */
.media-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px;align-items:stretch;margin-bottom:12px}
.media-hero .hero{margin:0}
.media-photo{width:100%;height:180px;object-fit:cover;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,#15253a,#233b55);display:block}
.section-tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 1px 10px;scrollbar-width:none}
.section-tabs::-webkit-scrollbar{display:none}
.section-tab{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 12px;border-radius:11px;white-space:nowrap;cursor:pointer;font-family:inherit}
.section-tab.active{border-color:#4da3ff;box-shadow:0 0 0 1px #4da3ff33 inset}
.info-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:right;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.info-card:hover,.country-card:hover,.geo-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.22)}
.info-card:active,.country-card:active{transform:scale(.98)}
.info-card .thumb{width:100%;height:125px;object-fit:cover;border-radius:11px;background:linear-gradient(135deg,#18283a,#243f5a);margin-bottom:9px}

const app = document.getElementById('app');

const history = [];
function nav(fn, push=true){
  if(push) history.push(fn);
  backBtn.style.display = history.length>1 ? 'flex':'none';
  app.innerHTML = '';
  const div = document.createElement('div');
  div.className='screen';
  app.appendChild(div);
  fn(div);
}

  history.pop();
  const prev = history[history.length-1];
  nav(prev, false);
}
function go(fn){ nav(fn); }

/* ============ MATH CORE ============ */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a;}
function lcm(a,b){ if(a===0||b===0) return 0; return Math.abs(a*b)/gcd(a,b); }
function fmtNum(n){
  if(!isFinite(n)) return '—';
  const r = Math.round(n*1e6)/1e6;
  return r.toString();
}

/* recursive-descent expression evaluator.
   Supports: + - * / ^ , sqrt(x) , sqrt[n](x) (nth root) , sin/cos/tan (degrees),
   log (base 10), ln (natural log), abs, constants pi/e, implicit multiplication
   (e.g. "2(3+4)", "(4[4]8)0"), and interchangeable ( ) [ ] { } brackets. */
const FA_DIGITS = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const EXPR_FUNCS = ['sin','cos','tan','log','ln','abs'];
const EXPR_CONSTS = {pi:Math.PI, e:Math.E};
function evalExpr(str){
  let s = str
    .split('').map(ch=>FA_DIGITS[ch]||ch).join('')
    .replace(/,/g,'.')
    .replace(/[×✕]/g,'*')
    .replace(/[÷]/g,'/')
    .replace(/\s+/g,'')
    .replace(/π/g,'pi');
  if(!s) throw new Error('عبارت خالی است');
  let i = 0;
  const OPEN = '([{', CLOSE = ')]}';
  function peek(){ return s[i]; }
  function err(){ throw new Error('عبارت نامعتبر است'); }
  function isOpen(c){ return c && OPEN.includes(c); }
  function isClose(c){ return c && CLOSE.includes(c); }
  function matchWord(w){ return s.slice(i,i+w.length)===w; }
  function startsFactor(){
    const c = peek();
    if(!c) return false;
    if(/[0-9.]/.test(c)) return true;
    if(isOpen(c)) return true;
    if(matchWord('sqrt')) return true;
    if(EXPR_FUNCS.some(f=>matchWord(f))) return true;
    if(Object.keys(EXPR_CONSTS).some(k=>matchWord(k))) return true;
    return false;
  }
  function parseExpr(){
    let v = parseTerm();
    while(peek()==='+'||peek()==='-'){
      const op = s[i++];
      const rhs = parseTerm();
      v = op==='+' ? v+rhs : v-rhs;
    }
    return v;
  }
  function parseTerm(){
    let v = parseSigned();
    while(true){
      if(peek()==='*'||peek()==='/'){
        const op = s[i++];
        const rhs = parseSigned();
        if(op==='/'){ if(rhs===0) throw new Error('تقسیم بر صفر ممکن نیست'); v = v/rhs; }
        else v = v*rhs;
      } else if(startsFactor()){
        // implicit multiplication: "4(3+2)", "(2)(3)", "3sqrt(4)"
        v = v * parseSigned();
      } else break;
    }
    return v;
  }
  // unary sign binds LOOSER than '^', so "-3^2" = -(3^2) = -9 (standard convention)
  function parseSigned(){
    if(peek()==='-'){ i++; return -parseSigned(); }
    if(peek()==='+'){ i++; return parseSigned(); }
    return parsePower();
  }
  function parsePower(){
    let v = parsePrimary();
    if(peek()==='^'){
      i++;
      const rhs = parseSigned(); // right-assoc; allows signed exponents like 2^-3
      v = Math.pow(v, rhs);
    }
    return v;
  }
  function parseGroup(){
    if(!isOpen(peek())) err();
    i++;
    const v = parseExpr();
    if(!isClose(peek())) err();
    i++;
    return v;
  }
  function parsePrimary(){
    if(isOpen(peek())) return parseGroup();
    if(matchWord('sqrt')){
      i+=4;
      if(peek()==='['){
        i++;
        const n = parseExpr();
        if(peek()!==']') err();
        i++;
        if(!isOpen(peek())) err();
        const x = parseGroup();
        if(n===0) throw new Error('درجه ریشه نمی‌تواند صفر باشد');
        if(x<0 && n%2===0) throw new Error('ریشه زوجِ عدد منفی تعریف‌نشده است');
        const r = x<0 ? -Math.pow(-x, 1/n) : Math.pow(x, 1/n);
        return r;
      }
      const v = parseGroup();
      if(v<0) throw new Error('جذر عدد منفی تعریف‌نشده است');
      return Math.sqrt(v);
    }
    const fn = EXPR_FUNCS.find(f=>matchWord(f));
    if(fn){
      i += fn.length;
      const x = parseGroup();
      if(fn==='sin') return Math.sin(x*Math.PI/180);
      if(fn==='cos') return Math.cos(x*Math.PI/180);
      if(fn==='tan') return Math.tan(x*Math.PI/180);
      if(fn==='log'){ if(x<=0) throw new Error('لگاریتم عدد نامثبت تعریف‌نشده است'); return Math.log10(x); }
      if(fn==='ln'){ if(x<=0) throw new Error('لگاریتم عدد نامثبت تعریف‌نشده است'); return Math.log(x); }
      if(fn==='abs') return Math.abs(x);
    }
    const cst = Object.keys(EXPR_CONSTS).find(k=>matchWord(k));
    if(cst){ i += cst.length; return EXPR_CONSTS[cst]; }
    const start = i;
    while(peek() && /[0-9.]/.test(peek())) i++;
    if(i===start) err();
    return parseFloat(s.slice(start,i));
  }
  const result = parseExpr();
  if(i !== s.length) err();
  if(isNaN(result)) throw new Error('عبارت نامعتبر است');
  return result;
}

/* ============ SHARED UI HELPERS ============ */
function fieldHTML(id,label,ph='مقدار را وارد کنید'){
  return `<div class="field"><label>${label}</label><input type="text" inputmode="decimal" id="${id}" placeholder="${ph}"></div>`;

function num(id){
  const el = document.getElementById(id);
  const v = parseFloat(String(el.value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,،]/g,'.'));
  return v;
}
function showResult(container, value, formula){
  let box = container.querySelector('.result-box');
  if(box) box.remove();
  box = document.createElement('div');
  box.className='result-box';
  box.innerHTML = `<div class="rlabel">نتیجه</div><div class="rvalue">${value}</div>${formula?`<div class="rformula">${formula}</div>`:''}`;
  container.appendChild(box);
}
function showError(container, msg){
  let box = container.querySelector('.result-box');
  if(box) box.remove();
  box = document.createElement('div');
  box.className='result-box';
  box.innerHTML = `<div class="rerror">⚠ ${msg}</div>`;
  container.appendChild(box);
}

 مذهبی","واژه‌نامه","نبوت، رسالت، امامت، ولایت، شفاعت، توکل، تقوا، توبه، اجتهاد، تقلید، فقه، کلام، تفسیر و سیره.","برای هر اصطلاح می‌توان تعریف، مثال و منبع جداگانه ارائه کرد."]];
function makeHistoryLines(x){
  const [name,period,area,people,places,summary]=x;
  const safe=v=>v||'اطلاعات تکمیلی در این نسخه ثبت نشده است';
  return [
    `پاراگراف ۱ — معرفی: «${name}» یکی از موضوعات مهم برای شناخت روندهای سیاسی، اجتماعی و فرهنگی تاریخ ایران و پیرامون آن است. این موضوع در بازه ${safe(period)} بررسی می‌شود و برای درک آن باید هم زمان، هم مکان و هم شخصیت‌های مرتبط را کنار هم دید.`,
    `پاراگراف ۲ — جغرافیا: گستره مرتبط با این موضوع ${safe(area)} بوده است. جغرافیا روی مسیرهای ارتباطی، کشاورزی، تجارت، دفاع و شکل‌گیری شهرها اثر می‌گذاشت و به همین دلیل نمی‌توان تاریخ این موضوع را جدا از محیط جغرافیایی آن مطالعه کرد.`,
    `پاراگراف ۳ — شخصیت‌ها: چهره‌ها و گروه‌های مهم این موضوع عبارت‌اند از ${safe(people)}. نقش هر شخصیت را باید در زمینه زمان خودش سنجید؛ بعضی فرمانروا بوده‌اند، بعضی مدیر، دانشمند، فرمانده یا چهره فرهنگی و اثر آنان از راه‌های متفاوتی در منابع باقی مانده است.`,
    `پاراگراف ۴ — مکان‌ها: مکان‌های شاخص مرتبط با این موضوع ${safe(places)} هستند. شهرها، پایتخت‌ها، دژها، کاخ‌ها، راه‌ها و مراکز مذهبی فقط نام روی نقشه نیستند؛ آن‌ها محل تصمیم‌گیری، زندگی مردم، دادوستد و گاهی برخورد قدرت‌های مختلف بوده‌اند.`,
    `پاراگراف ۵ — روند تاریخی: خلاصه این موضوع چنین است: ${safe(summary)}. این روند معمولاً یک اتفاق جدا و ناگهانی نیست، بلکه از چند مرحله تشکیل می‌شود؛ زمینه‌های قبلی شکل می‌گیرند، یک تغییر مهم رخ می‌دهد و سپس پیامدهای آن در سال‌ها یا حتی سده‌های بعد دیده می‌شود.`,
    `پاراگراف ۶ — جامعه و اقتصاد: پشت هر حکومت و رویداد تاریخی، زندگی مردم عادی نیز جریان داشته است. مالیات، زمین، آب، کشاورزی، صنعت، تجارت، مهاجرت و امنیت راه‌ها بر توان حکومت‌ها و وضعیت شهرها اثر می‌گذاشتند و گاهی همین عوامل زمینه تغییرات سیاسی را فراهم می‌کردند.`,

function detailPanel(root,title,rows,opts={}){

 root.innerHTML=`<div class="panel">${img}<div class="panel-title">${title}</div><div class="detail-meta">${rows.map(x=>`<div class="meta"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>${paragraphs.length?`<div class="long-paragraphs">${paragraphs.map((s,i)=>`<p class="long-paragraph"><span>${i+1}</span>${s}</p>`).join('')}</div>`:''}</div>`;
}

function screenReligionHome(root){

  </div>

  const prophetInfo=RELIGION_DATA;
  function prophetRecord(name,i){ return prophetInfo.find(x=>x[0]===name)||[name,'پیامبر','تاریخ دقیق تولد در این نسخه مشخص نشده','شرح آموزشی زندگی و جایگاه پیامبر در روایت اسلامی','برای جزئیات به منابع معتبر دینی مراجعه شود']; }

    }else if(sec==='worship'){
      const rows=[["ارکان نماز","۵ رکن در فقه امامیه: نیت، تکبیرةالاحرام، قیام متصل به رکوع، رکوع، دو سجده از یک رکعت."],["واجبات نماز","۱۱ مورد: نیت، قیام، تکبیرةالاحرام، قرائت، ذکر، رکوع، سجود، تشهد، سلام، ترتیب و موالات."],["پنج نماز روزانه","صبح، ظهر، عصر، مغرب و عشا."],["وضو","طهارت با آب با ترتیب و شرایط فقهی."],["تیمم","روش طهارت در شرایط خاص نبودن یا زیان‌داشتن استفاده از آب."],["حج","عبادت و زیارت کعبه همراه با مناسک مشخص."],["روزه","خودداری از مفطرات با نیت عبادت در زمان شرعی."],["اذان و اقامه","اعلام وقت و آمادگی برای نماز با الفاظ و ترتیب مشخص."]];
      box.innerHTML=`<div class="info-grid">${rows.map((x,i)=>`<button class="info-card" data-i="${i}"><img class="thumb" src="${religionImg(x[0])}" alt="${x[0]}" onerror="this.style.display='none'"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>`;
      box.querySelectorAll('.info-card').forEach(b=>b.onclick=()=>{let x=rows[+b.dataset.i];let rec=[x[0],'عبادت و نماز',x[1],'جزئیات فقهی ممکن است میان مذاهب متفاوت باشد.','برای احکام دقیق به منبع فقهی معتبر مراجعه شود.'];detailPanel(root,x[0],[['دسته','عبادت و نماز'],['خلاصه',x[1]]],{image:religionImg(x[0]),lines:makeReligionLines(rec)})});
    }else{
      const terms=["توحید","نبوت","رسالت","امامت","ولایت","معاد","تقوا","توبه","شفاعت","توکل","اجتهاد","تقلید","فقه","کلام","تفسیر","سیره","حدیث","رجال","درایه","اجماع","قیاس","عبادت","طهارت","قبله","نیت","اخلاص","صدقه","زکات","خمس","حج"];

    }
  }
  root.querySelectorAll('.section-tab').forEach(b=>b.onclick=()=>render(b.dataset.sec));
  render('info');
}

  function resize(){
    const dpr=Math.min(devicePixelRatio||1,2), rect=canvas.getBoundingClientRect();
    canvas.width=Math.max(1,Math.floor(rect.width*dpr)); canvas.height=Math.max(1,Math.floor(rect.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function project(lat,lon){
    const lr=lat*Math.PI/180, lo=lon*Math.PI/180+rotY;
    const x=Math.cos(lr)*Math.sin(lo), y=Math.sin(lr), z=Math.cos(lr)*Math.cos(lo);
    const cy=Math.cos(rotX), sy=Math.sin(rotX), yy=y*cy-z*sy, zz=y*sy+z*cy;
    return {x,y:yy,z:zz};
  }
  function draw(){
    const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,R=Math.min(w,h)*.34*zoom;
    ctx.clearRect(0,0,w,h);
    const g=ctx.createRadialGradient(cx-R*.35,cy-R*.42,R*.12,cx,cy,R*1.12);
    g.addColorStop(0,'#55cfff');g.addColorStop(.42,'#1978ad');g.addColorStop(1,'#062e50');
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
    // atmosphere + grid
    for(let a=-80;a<=80;a+=20){
      ctx.beginPath();
      for(let i=-180;i<=180;i+=4){const p=project(a,i);const px=cx+p.x*R,py=cy-p.y*R;if(i===-180)ctx.moveTo(px,py);else ctx.lineTo(px,py)}
      ctx.strokeStyle='rgba(184,237,255,.18)';ctx.lineWidth=1;ctx.stroke();
    }
    for(let lon=-160;lon<=160;lon+=20){
      ctx.beginPath();
      let started=false;
      for(let lat=-90;lat<=90;lat+=3){const p=project(lat,lon);const px=cx+p.x*R,py=cy-p.y*R;if(p.z>-.03){if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}}
      ctx.strokeStyle='rgba(184,237,255,.15)';ctx.lineWidth=1;ctx.stroke();
    }
    // stylized land masses, rotated with the sphere
    const land=[[-10,-65,25,45],[25,55,32,60],[5,100,38,90],[-22,135,22,70],[40,-20,35,40],[-30,20,30,70],[-55,145,12,35],[70,-40,14,40]];
    land.forEach(([lat,lon,ha,wa],idx)=>{
      const p=project(lat,lon); if(p.z<-.05)return;
      ctx.save();ctx.translate(cx+p.x*R,cy-p.y*R);ctx.rotate((lon*.017)+rotY*.2);
      ctx.fillStyle=['#55b879','#68c98b','#3da86b','#7acb91'][idx%4];
      ctx.globalAlpha=.88;ctx.beginPath();ctx.ellipse(0,0,Math.max(10,wa*R/180),Math.max(8,ha*R/180),0,0,Math.PI*2);ctx.fill();ctx.restore();
    });
    // country markers
    COUNTRIES.forEach(c=>{
      if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return;
      const p=project(c.lat,c.lng); if(p.z<0.02)return;
      const px=cx+p.x*R,py=cy-p.y*R, rr=Math.max(2.2,3.2+p.z*2);
      ctx.beginPath();ctx.arc(px,py,rr,0,Math.PI*2);ctx.fillStyle='#ffd76b';ctx.shadowColor='#ffd76b';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    });
    ctx.restore();
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(157,232,255,.75)';ctx.lineWidth=2;ctx.stroke();
    const at=ctx.createRadialGradient(cx-R*.55,cy-R*.5,R*.1,cx,cy,R*1.15);at.addColorStop(0,'rgba(255,255,255,.22)');at.addColorStop(1,'rgba(77,163,255,0)');
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle=at;ctx.fill();
    if(auto&&!drag)rotY+=0.0035;
    requestAnimationFrame(draw);
  }
  function hitCountry(e){
    const rect=canvas.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
    const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,R=Math.min(w,h)*.34*zoom;
    let best=null,bd=16;
    COUNTRIES.forEach(c=>{if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return;const p=project(c.lat,c.lng);if(p.z<0.05)return;const d=Math.hypot(cx+p.x*R-x,cy-p.y*R-y);if(d<bd){bd=d;best=c;}});
    if(best){selected.textContent=best.flag+' '+best.fa; root.querySelector('#countrySearch').value=best.fa; renderCountries(); setTimeout(()=>countryDetail(root,best),80);}
  }
  canvas.addEventListener('pointerdown',e=>{drag=true;auto=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-lastX)*.008;rotX+=(e.clientY-lastY)*.006;rotX=Math.max(-1.2,Math.min(1.2,rotX));lastX=e.clientX;lastY=e.clientY});
  canvas.addEventListener('pointerup',e=>{drag=false;canvas.releasePointerCapture?.(e.pointerId)});
  canvas.addEventListener('pointercancel',()=>drag=false); canvas.addEventListener('click',hitCountry);
  root.querySelector('#geoAuto').onclick=()=>{auto=!auto;root.querySelector('#geoAuto').textContent='چرخش خودکار: '+(auto?'روشن':'خاموش')};
  root.querySelector('#geoReset').onclick=()=>{rotY=.15;rotX=-.18;zoom=1;auto=true;root.querySelector('#geoAuto').textContent='چرخش خودکار: روشن'};
  root.querySelector('#geoZoomIn').onclick=()=>zoom=Math.min(1.45,zoom+.12);
  root.querySelector('#geoZoomOut').onclick=()=>zoom=Math.max(.72,zoom-.12);
  window.addEventListener('resize',resize); resize();

  function renderCountries(){
    const q=(root.querySelector('#countrySearch').value||'').trim().toLowerCase(), f=root.querySelector('#countryFilter').value;
    const arr=COUNTRIES.filter(c=>(f==='all'||c.continent===f) && [c.fa,c.en,c.capital,c.code].join(' ').toLowerCase().includes(q));
    root.querySelector('#countryList').innerHTML=arr.map(c=>`<button class="country-card" data-code="${c.code}">
      <span class="country-flag">${c.flag}</span><b>${c.fa} <small style="display:inline">(${c.en})</small></b>
      <small>پایتخت: ${c.capital}</small><small>مساحت: ${Number(c.area||0).toLocaleString('fa-IR')} km² · جمعیت: ${Number(c.population||0).toLocaleString('fa-IR')}</small>
      <small class="country-mini">${c.continent} · ${c.religion||'اطلاعات ثبت نشده'}</small></button>`).join('') || '<div class="panel">کشوری با این جستجو پیدا نشد.</div>';
    root.querySelectorAll('.country-card').forEach(b=>b.onclick=()=>countryDetail(root,COUNTRIES.find(c=>c.code===b.dataset.code)));
  }
  root.querySelector('#countrySearch').oninput=renderCountries;root.querySelector('#countryFilter').onchange=renderCountries;renderCountries();draw();
}

      <p class="long-paragraph"><span>۳</span>برای مطالعهٔ دقیق‌تر دربارهٔ تاریخ، فرهنگ، اقتصاد، آب‌وهوا و جغرافیای طبیعی این کشور باید منابع تخصصی هر موضوع جداگانه بررسی شوند؛ این صفحه یک کارت آموزشی فشرده است.</p>

/* ============ CHAT ============ */
const chatMemory = { name:null };
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function botReplyBase(input){
  const t = input.trim().toLowerCase();
  const has = (...words)=> words.some(w=>nbHas(t,w));
  const S = moodIcon('smile', 'var(--amber)');
  const W = moodIcon('wink', 'var(--teal)');
  const L = moodIcon('laugh', 'var(--rose)');
  const ST = moodIcon('star', 'var(--amber)');
  const C = moodIcon('cloud', 'var(--sky)');
  const M = moodIcon('moon', 'var(--sky)');
  const H = moodIcon('heart', 'var(--rose)');
  const B = moodIcon('bulb', 'var(--amber)');

  // identity / capabilities
  if(has('اسمت چیه','اسمت چیست','تو کی هستی','خودتو معرفی','تو چی هستی','معرفی کن'))
    return pick([
      `من یه Nova Book همه‌فنِ‌حریفم؛ گفتگو می‌کنم، ریاضی پیشرفته حل می‌کنم، زبان تمرین می‌کنم و فیزیک گسترده دارم ${S}`,
      `یه برنامه‌ی کوچیکم که کامل روی سیستم تو اجرا می‌شم، بدون اینترنت ${W}`,
      `یه دستیار محلی‌ام با چهار تا مهارت: گفتگو، ریاضی، زبان و فیزیک!`
    ]);

  if(has('چیکار میکنی','چیکار بلدی','چه کمکی میتونی','چیکار میتونی بکنی','چه کارایی بلدی','چیکاره ای'))
    return `می‌تونم باهات گپ بزنم، توی «ریاضیات» جذر، توان، معادله، آمار و مسئله متنی حل کنم، توی «زبان» واژه انگلیسی و عربی یادت بدم و توی «فیزیک» فرمول‌هایی مثل چگالی و انرژی رو حساب کنم ${B}`;

  if(has('کی ساختت','سازنده‌ات','چه کسی درستت کرده'))
    return 'من رو کاربرم برای استفاده‌ی شخصی و آفلاین طراحی کرده — یه فایل ساده‌ی HTML که همه‌چیزش همین‌جاست.';

  // user introduces their name
  if(/اسم من|من\s+.+\s+هستم|نامم/.test(t)){
    let m = input.match(/اسم من\s+([^\s.,!؟]+)/) || input.match(/من\s+([^\s.,!؟]+)\s+هستم/);
    if(m){ chatMemory.name = m[1]; return pick([`خوشبختم ${chatMemory.name}! از این به بعد یادم می‌مونه ${S}`, `چه اسم باحالی، ${chatMemory.name} جان! ${ST}`]); }
  }
  if(has('اسم من چیه','اسمم چیه','اسممو یادته'))
    return chatMemory.name ? `اسمت ${chatMemory.name}ـه! یادم مونده ${W}` : 'هنوز اسمت رو بهم نگفتی؛ می‌تونی بگی «اسم من ...ه».';

  // greetings
  if(has('سلام','درود','سلاااام','سلام علیکم'))
    return chatMemory.name
      ? pick([`سلام ${chatMemory.name}! چه خبر؟ ${S}`, `به‌به، سلام ${chatMemory.name}! چطوری؟`])
      : pick(['سلام! خوش اومدی، چطور می‌تونم کمکت کنم؟','درود بر تو! چه کمکی از دستم برمیاد؟',`سلام سلام! حالت چطوره؟ ${S}`,'سلام رفیق! امروز قراره چیکار کنیم؟']);

  if(has('صبح بخیر'))
    return pick(['صبح تو هم بخیر! روز خوبی داشته باشی.','سلام، صبح بخیر! امروز چه برنامه‌ای داری؟']);
  if(has('عصر بخیر'))
    return 'عصر تو هم بخیر باشه!';
  if(has('شب بخیر'))
    return pick([`شب بخیر، خواب‌های خوب ببینی ${M}`,'شب تو هم بخیر!']);

  // farewell
  if(has('خداحافظ','بدرود','بای بای','فعلا','می‌رم دیگه','میرم دیگه'))
    return pick([`خداحافظ! هر وقت خواستی دوباره اینجا باش ${S}`,'فعلاً! مراقب خودت باش.','به امید دیدار دوباره!']);

  // feelings
  if(has('حالت چطوره','حالت خوبه','چطوری','خوبی؟'))
    return pick(['من که همیشه آماده‌ام! تو چطوری؟','عالی‌ام، ممنون که پرسیدی. حال تو چطوره؟']);

  if(has('خوبم','عالیم','بد نیستم','خوبه','راضیم'))
    return pick([`خوشحالم که حالت خوبه! ${S}`,'عالیه، خوشحال شدم شنیدم.']);

  if(has('بدم','خسته','ناراحت','غمگین','دلم گرفته','افسرده‌ام','حوصله ندارم'))
    return pick([
      'متاسفم که این‌طوری‌ای. امیدوارم زودتر بهتر بشه.',
      'گاهی همه‌مون یه روزهایی مثل این داریم. اگه دوست داری یه مسئله ریاضی حل کنیم تا حواست پرت بشه، بگو!',
      'می‌فهمم. اگه دوست داری حرف بزنیم درباره‌ش، من اینجام.'
    ]);

  if(has('استرس دارم','نگرانم','می‌ترسم','میترسم'))
    return 'نفس عمیق بکش، از پسش برمیای. اگه استرست از یه مسئله درسیه، بگو تا با هم قدم‌به‌قدم حلش کنیم.';

  if(has('امتحان دارم','فردا امتحان','کنکور'))
    return pick([`موفق باشی! اگه یه مسئله ریاضی داری برای تمرین بگو تا با هم حلش کنیم ${ST}`,'میتونی از پسش بربیای، فقط قدم به قدم پیش برو.']);

  // thanks / politeness
  if(has('ممنون','مرسی','متشکرم','سپاس','دستت درد نکنه','لطف کردی'))
    return pick(['خواهش می‌کنم!',`قابلی نداشت ${S}`,'خوشحالم که تونستم کمک کنم.']);

  // compliments to the bot
  if(has('باهوشی','عالی هستی','خیلی خوبی','دوست دارم','باحالی','توپی','محشری'))
    return pick([`لطف داری! خوشحالم که به کارت میام ${H}`,`ممنون از محبتت ${S}`]);

  // rude input — stay polite
  if(has('احمقی','بی‌عرضه','خنگی','بدرد نمیخوری'))
    return 'سعی می‌کنم بهتر بشم. اگه چیزی رو اشتباه جواب دادم بهم بگو تا درستش کنم.';

  // date / time
  if(has('ساعت چنده','امروز چندشنبه','تاریخ امروز','چه ساعتیه')){
    const now = new Date();
    return `تاریخ و ساعت سیستم شما: ${now.toLocaleDateString('fa-IR')} — ${now.toLocaleTimeString('fa-IR')}`;
  }

  // weather (can't check — offline)
  if(has('هوا چطوره','آب و هوا','هوا چجوریه'))
    return `چون کاملاً آفلاینم، به اطلاعات آب‌وهوای لحظه‌ای دسترسی ندارم. کاش می‌شد از پنجره نگاه کنم! ${C}`;

  // richer conversation
  if(has('صبح','صبحونه','صبحانه')) return pick(['صبح بخیر! چه برنامه‌ای برای امروز داری؟','صبح قشنگی داشته باشی! من آماده‌ام، بگو از کجا شروع کنیم.']);
  if(has('شب','خواب','خوابیدی')) return pick(['شب بخیر! امیدوارم استراحت خوبی داشته باشی.','وقت استراحته؟ من اینجام، هر وقت برگشتی ادامه می‌دیم.']);

  if(has('بازی','سرگرمی') && has('بازی کنیم','بازی کنیم؟')) return 'حتماً! یکی را انتخاب کن: «چیستان»، «حدس عدد»، «جوک» یا «چالش ریاضی».';

  // jokes / riddles

      `یه ریاضی‌دان به دوستش می‌گه: «تو بی‌نهایتی!» دوستش می‌گه: «نه بابا، من فقط حوصله‌ام سر رفته!» ${L}`,
      `چرا عدد ۶ ترسیده بود؟ چون ۷، ۸، ۹ کردنش! ${L}`,

      'به فیزیک‌دان‌ها اعتماد نکن، همیشه یه نیرو پشتشونه که هلشون میده!'
    ]);

    return pick(['چیستان: چه عددی رو با هر عددی جمع کنی، همون عدد باقی می‌مونه؟ (جواب: صفر)','چیستان: هرچی از من برداری، بزرگ‌تر می‌شم؛ من چیم؟ (جواب: گودال)']);

  // small talk / preferences (playful, fixed answers)
  if(has('چه خبر','خبری نیست','چه خبرا'))
    return pick(['خبر خاصی نیست، منتظر حرف‌های توام!','همه‌چی آرومه، تو چه خبر؟']);

  if(has('غذای موردعلاقه','چی دوست داری بخوری'))
    return 'من که غذا نمی‌خورم، ولی اگه بخوام انتخاب کنم، یه بشقاب پر از عدد و معادله بد نیست!';

  if(has('رنگ موردعلاقه'))
    return 'به آبی و کهربایی علاقه دارم — دقیقاً رنگ‌های همین برنامه!';

  if(has('فوتبال','والیبال','بسکتبال') && has('دوست داری','بلدی'))
    return 'تماشاگر خوبی‌ام ولی چون آفلاینم از نتیجه بازی‌های زنده خبر ندارم!';

  if(has('آهنگ گوش میدی','موزیک گوش میدی'))
    return 'من گوش ندارم، ولی می‌دونم آهنگ‌ها هم از فرکانس و ریاضی ساخته شدن!';

  if(has('چند سالته','سنت چنده'))
    return 'من سن ندارم؛ هر بار بازم می‌کنی انگار تازه به دنیا اومدم!';

  if(has('کجا زندگی میکنی','کجایی'))
    return 'من همین‌جام، توی همین فایل و مرورگر تو زندگی می‌کنم.';

  if(has('خوابم میاد','خسته‌ام برای خواب'))
    return 'پس برو بخواب، من همیشه اینجام و هر وقت بیدار شدی می‌تونیم ادامه بدیم.';

  if(has('کمکم کن','راهنماییم کن','کمک میخوام'))
    return 'حتماً! بگو دقیقاً با چی مشکل داری تا کمکت کنم.';

  if(has('دوستمی','دوست منی'))
    return `البته که دوستتم! هر وقت خواستی صحبت کنی، اینجام ${H}`;

  // subject redirects
  if(has('ریاضی','مسئله ریاضی','محاسبه','جذر','ضرب','تقسیم','جمع کن','تفریق','معادله'))
    return 'برای حل مسائل ریاضی از بخش «ریاضیات» توی منوی اصلی استفاده کن، اونجا دقیق و با فرمول حساب می‌کنم.';

  if(has('انگلیسی','عربی','ترجمه کن','معنی این کلمه','لغت'))
    return 'برای واژگان انگلیسی، عربی و اصطلاحات فارسی از بخش «زبان» توی منوی اصلی استفاده کن.';

  if(has('فیزیک','چگالی','نیرو چیه','انرژی'))
    return 'فرمول‌های فیزیک پایه مثل چگالی، انرژی و نیرو رو می‌تونی توی بخش «فیزیک» حساب کنی.';

  if(has('چطور کار میکنی','آفلاینی','اینترنت','اینترنت لازم داری'))
    return 'بله، من کاملاً روی همین سیستم اجرا می‌شم و به اینترنت نیازی ندارم.';

  // simple yes/no
  if(/^(بله|آره|اره|بلی)$/.test(t))
    return pick(['خوبه!','عالیه، ادامه بده.']);
  if(/^(نه|نخیر|خیر)$/.test(t))
    return pick(['باشه، اشکالی نداره.','قبول، هر جور راحتی.']);

  const fallback = [
    'جالبه، بیشتر برام بگو.',
    'متوجه شدم. چیز دیگه‌ای هم هست؟',
    'می‌تونی واضح‌تر بگی منظورت چیه؟',
    'باشه! کمک دیگه‌ای از دستم برمیاد؟',
    'هوم، در این مورد اطلاعات زیادی ندارم، ولی اگه سوال ریاضی، زبان یا فیزیک داری خوشحال می‌شم کمک کنم.',
    'برام تازگی داره؛ می‌تونی بیشتر توضیح بدی؟',
    'قشنگه! چیز دیگه‌ای هم توی ذهنته؟'
  ];
  return pick(fallback);
}

function screenChat(root){
  root.innerHTML = `
    <div class="panel-title" style="margin-bottom:4px;">گفتگوی محاوره‌ای</div>
    <div class="panel-sub">یه پیام بنویس و اینتر بزن</div>
    <div class="chat-wrap">
      <div class="chat-log" id="log"></div>
      <div class="chat-input-bar">
        <input id="chatInput" type="text" placeholder="پیامت رو بنویس...">
        <button class="chat-send" id="sendBtn">${ICONS.send}</button>
      </div>
    </div>
  `;
  const log = root.querySelector('#log');
  const input = root.querySelector('#chatInput');
  function escapeHTML(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function addBubble(text, who){
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    if(who==='bot') b.innerHTML = text; // bot text is our own content and may include mood-icon spans
    else b.textContent = text; // user text stays as plain text (never rendered as HTML)
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
  }
  addBubble(`سلام! من Nova Book توام. حرف بزن ${moodIcon('smile','var(--amber)')}`, 'bot');
  function send(){
    const v = input.value.trim();
    if(!v) return;
    addBubble(v,'me');
    input.value='';
    setTimeout(()=>addBubble(botReply(v),'bot'), 260);
  }
  root.querySelector('#sendBtn').onclick = send;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
}

function screenPrimeMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">اعداد اول و تجزیه</div><div class="panel-sub">یک عدد صحیح مثبت وارد کن</div>${fieldHTML('pmN','عدد') }<button class="solve-btn" id="pmB">تحلیل عدد</button></div>`;const p=root.querySelector('.panel');root.querySelector('#pmB').onclick=()=>{let n=Math.round(num('pmN'));if(!Number.isInteger(n)||n<2)return showError(p,'عدد صحیح بزرگ‌تر از 1 وارد کن.');let x=n,f=[];for(let d=2;d*d<=x;d+=(d===2?1:2)){while(x%d===0){f.push(d);x/=d;}}if(x>1)f.push(x);showResult(p,f.length===1?'این عدد اول است.':'تجزیه: '+f.join(' × '),`مقسوم‌علیه‌های اول: ${[...new Set(f)].join('، ')}`);};}
function screenRatioMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">نسبت و تناسب</div><div class="panel-sub">a:b = c:x</div><div class="row2">${fieldHTML('ra','a')}${fieldHTML('rb','b')}</div><div class="row2">${fieldHTML('rc','c')}${fieldHTML('rx','x (خالی بگذار)')}</div><button class="solve-btn" id="rB">حل تناسب</button></div>`;const p=root.querySelector('.panel');root.querySelector('#rB').onclick=()=>{const a=num('ra'),b=num('rb'),c=num('rc'),x=num('rx');if([a,b,c].some(isNaN)||a===0)return showError(p,'a، b و c را وارد کن.');if(isNaN(x)){showResult(p,`x = ${fmtNum(b*c/a)}`,`${a}:${b} = ${c}:x`);}else{showResult(p,`نسبت اول = ${fmtNum(a/b)} ، نسبت دوم = ${fmtNum(c/x)}`,`تفاضل نسبت‌ها = ${fmtNum(a/b-c/x)}`);}};}
function screenProbabilityMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">احتمال ساده</div><div class="panel-sub">حالت‌های مطلوب و کل حالت‌ها</div><div class="row2">${fieldHTML('fav','حالت مطلوب')}${fieldHTML('tot','کل حالت‌ها')}</div><button class="solve-btn" id="prB">محاسبه احتمال</button></div>`;const p=root.querySelector('.panel');root.querySelector('#prB').onclick=()=>{const a=num('fav'),b=num('tot');if(isNaN(a)||isNaN(b)||b<=0||a<0||a>b)return showError(p,'مقادیر معتبر وارد کن.');const q=a/b;showResult(p,`${fmtNum(q)}  (${fmtNum(q*100)}٪)`,`P = حالت‌های مطلوب ÷ کل حالت‌ها = ${a}/${b}`);};}
function screenSequenceMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">دنباله حسابی و هندسی</div><div class="panel-sub">جمله اول، قدر نسبت/تفاضل و شماره جمله</div>${fieldHTML('sqA','جمله اول a₁')}${fieldHTML('sqD','اختلاف d یا نسبت r')}${fieldHTML('sqN','شماره جمله n')}<div class="field"><label>نوع</label><select id="sqT"><option value="a">حسابی</option><option value="g">هندسی</option></select></div><button class="solve-btn" id="sqB">محاسبه</button></div>`;const p=root.querySelector('.panel');root.querySelector('#sqB').onclick=()=>{const a=num('sqA'),d=num('sqD'),n=Math.round(num('sqN'));if([a,d].some(isNaN)||!Number.isInteger(n)||n<1)return showError(p,'مقادیر معتبر وارد کن.');if(document.getElementById('sqT').value==='a'){const an=a+(n-1)*d,sm=n*(a+an)/2;showResult(p,`aₙ = ${fmtNum(an)}`,`مجموع n جمله = ${fmtNum(sm)}`);}else{const an=a*Math.pow(d,n-1),sm=d===1?a*n:a*(Math.pow(d,n)-1)/(d-1);showResult(p,`aₙ = ${fmtNum(an)}`,`مجموع n جمله = ${fmtNum(sm)}`);}};}
function screenCoordinateMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">هندسه مختصاتی</div><div class="panel-sub">دو نقطه A و B را وارد کن</div><div class="row2">${fieldHTML('x1','x₁')}${fieldHTML('y1','y₁')}</div><div class="row2">${fieldHTML('x2','x₂')}${fieldHTML('y2','y₂')}</div><button class="solve-btn" id="coB">محاسبه</button></div>`;const p=root.querySelector('.panel');root.querySelector('#coB').onclick=()=>{const [x1,y1,x2,y2]=['x1','y1','x2','y2'].map(num);if([x1,y1,x2,y2].some(isNaN))return showError(p,'هر چهار مختصات را وارد کن.');const dx=x2-x1,dy=y2-y1,dist=Math.hypot(dx,dy),mid=`(${fmtNum((x1+x2)/2)}, ${fmtNum((y1+y2)/2)})`;showResult(p,`فاصله = ${fmtNum(dist)}`,`شیب = ${dx===0?'تعریف‌نشده':fmtNum(dy/dx)}<br>نقطه میانی = ${mid}`);};}
function screenCombinatoricsMath(root){root.innerHTML=`<div class="panel"><div class="panel-title">ترکیب و جایگشت</div><div class="panel-sub">n و r را وارد کن</div><div class="row2">${fieldHTML('cn','n')}${fieldHTML('cr','r')}</div><button class="solve-btn" id="cbB">محاسبه</button></div>`;const p=root.querySelector('.panel');root.querySelector('#cbB').onclick=()=>{const n=Math.round(num('cn')),r=Math.round(num('cr'));if(!Number.isInteger(n)||!Number.isInteger(r)||n<0||r<0||r>n||n>170)return showError(p,'n و r را صحیح و در محدوده مناسب وارد کن.');let f=1;for(let i=2;i<=n;i++)f*=i;let pr=1;for(let i=0;i<r;i++)pr*=n-i;let rf=1;for(let i=2;i<=r;i++)rf*=i;showResult(p,`جایگشت nPr = ${fmtNum(pr)}<br>ترکیب nCr = ${fmtNum(pr/rf)}`,`n! = ${fmtNum(f)}`);};}

/* ============ LCM / GCD ============ */
/* ---- shared prime-factorization helpers (also used by screenPrimeMath) ---- */
function primeFactorList(n){
  let x=n, f=[];
  for(let d=2; d*d<=x; d+=(d===2?1:2)){ while(x%d===0){ f.push(d); x/=d; } }
  if(x>1) f.push(x);
  return f;
}
function factorPowers(list){ const o={}; list.forEach(p=>o[p]=(o[p]||0)+1); return o; }

const GCD_STEP_LIMIT = 200000; // above this we still give the answer, but skip the heavy step-by-step listings

/* 1) روش نردبانی / تقسیم پلکانی مشترک: هر بار یک عامل اول مشترک را از هر دو عدد می‌گیریم */
function renderLadderMethod(a,b,g,l){
  let html = `<div class="method-block"><h4>۱) روش نردبانی (تقسیم پلکانی مشترک)</h4>`;
  html += `<div class="method-note">هر بار یک عامل اول را که روی <b>هر دو</b> عدد باقی‌مانده اثر می‌کند کنار آن‌ها می‌نویسیم و هر دو را بر آن تقسیم می‌کنیم؛ این کار را تا جایی ادامه می‌دهیم که دو عدد باقی‌مانده دیگر عامل مشترکی نداشته باشند (نسبت به هم اول شوند).</div>`;
  if(a>GCD_STEP_LIMIT || b>GCD_STEP_LIMIT){
    html += `<div class="method-note">برای اعداد بزرگ‌تر از ${GCD_STEP_LIMIT.toLocaleString('en-US')} جدول گام‌به‌گام نمایش داده نمی‌شود، ولی نتیجه (ب.م.م = ${g}، ک.م.م = ${l}) با همین روش به‌دست آمده.</div></div>`;
    return html;
  }
  let cx=a, cy=b, divs=[], rows=[];
  let guard=0;
  while(guard<400){
    guard++;
    let p=null;
    const upper=Math.min(cx,cy);
    for(let d=2; d<=upper; d++){ if(cx%d===0 && cy%d===0){ p=d; break; } }
    if(p===null) break;
    rows.push({p, before:[cx,cy]});
    cx/=p; cy/=p;
    divs.push(p);
  }
  html += `<div class="ladder-box"><div class="ladder-row head"><span>عامل</span><span>${a}</span><span>${b}</span></div>`;
  rows.forEach(r=>{
    html += `<div class="ladder-row"><span class="lp">${r.p}</span><span>${r.before[0]/r.p}</span><span>${r.before[1]/r.p}</span></div>`;
  });
  html += `</div>`;
  if(divs.length){
    html += `<div class="method-note">ب.م.م = حاصل‌ضرب عامل‌های کنار نردبان = ${divs.join(' × ')} = <b>${g}</b><br>ک.م.م = ب.م.م × باقی‌مانده‌های آخر (که دیگر عامل مشترک ندارند) = ${g} × ${cx} × ${cy} = <b>${l}</b></div>`;
  }else{
    html += `<div class="method-note">این دو عدد از همان ابتدا هیچ عامل اول مشترکی ندارند، یعنی نسبت به هم اول‌اند؛ پس ب.م.م = ۱ و ک.م.م = حاصل‌ضرب دو عدد = <b>${l}</b></div>`;
  }
  html += `</div>`;
  return html;
}

/* 2) روش درختی / تجزیه به عامل‌های اول */
function renderTreeMethod(a,b,g,l){
  let html = `<div class="method-block"><h4>۲) روش درختی (تجزیه به عامل‌های اول)</h4>`;
  html += `<div class="method-note">هر عدد را مثل یک درخت می‌شکنیم تا فقط عامل‌های اول بمانند. برای <b>ب.م.م</b>، عامل‌های اولِ مشترک را با کوچک‌ترین توانشان و برای <b>ک.م.م</b>، همهٔ عامل‌های اول را با بزرگ‌ترین توانشان ضرب می‌کنیم.</div>`;
  if(a>GCD_STEP_LIMIT || b>GCD_STEP_LIMIT){
    html += `<div class="method-note">برای اعداد خیلی بزرگ، تجزیهٔ کامل نمایش داده نمی‌شود.</div></div>`;
    return html;
  }
  const fa=primeFactorList(a), fb=primeFactorList(b);
  const pa=factorPowers(fa), pb=factorPowers(fb);
  const primes=[...new Set([...Object.keys(pa),...Object.keys(pb)])].map(Number).sort((x,y)=>x-y);
  let gcdParts=[], lcmParts=[];
  primes.forEach(p=>{
    const ea=pa[p]||0, eb=pb[p]||0, mn=Math.min(ea,eb), mx=Math.max(ea,eb);
    if(mn>0) gcdParts.push(mn===1?`${p}`:`${p}<sup>${mn}</sup>`);
    lcmParts.push(mx===1?`${p}`:`${p}<sup>${mx}</sup>`);
  });
  const factLine=(n,f)=> f.length===0 ? `${n} = ۱ (عدد ۱ عامل اول ندارد)` : f.length>1 ? `${n} = ${f.join(' × ')}` : `${n} = ${f[0]} (خودش عدد اول است)`;
  html += `<div class="tree-fact">${factLine(a,fa)}</div>`;
  html += `<div class="tree-fact">${factLine(b,fb)}</div>`;
  html += `<div class="method-note">ب.م.م = ${gcdParts.length?gcdParts.join(' × '):'۱ (عامل مشترکی ندارند)'} = <b>${g}</b><br>ک.م.م = ${lcmParts.join(' × ')} = <b>${l}</b></div>`;
  html += `</div>`;
  return html;
}

/* 3) روش خطی / فهرست کردن مقسوم‌علیه‌ها و مضرب‌ها */
function renderListMethod(a,b,g,l){
  let html = `<div class="method-block"><h4>۳) روش خطی (فهرست کردن مقسوم‌علیه‌ها و مضرب‌ها)</h4>`;
  html += `<div class="method-note">برای <b>ب.م.م</b> همهٔ مقسوم‌علیه‌های هر عدد را می‌نویسیم و بزرگ‌ترین عدد مشترک بین دو فهرست را پیدا می‌کنیم. برای <b>ک.م.م</b> چند مضرب اول هر عدد را می‌نویسیم تا اولین مضرب مشترک را پیدا کنیم.</div>`;
  if(a<=GCD_STEP_LIMIT && b<=GCD_STEP_LIMIT){
    const divisorsOf=n=>{const ds=[];for(let i=1;i<=n;i++) if(n%i===0) ds.push(i); return ds;};
    const da=divisorsOf(a), db=divisorsOf(b);
    const chipRow=(arr,mark)=>`<div class="chip-row">${arr.map(x=>`<span class="chip${x===mark?' hit':''}">${x}</span>`).join('')}</div>`;
    html += `<div class="list-box"><div class="list-title">مقسوم‌علیه‌های ${a}</div>${chipRow(da,g)}</div>`;
    html += `<div class="list-box"><div class="list-title">مقسوم‌علیه‌های ${b}</div>${chipRow(db,g)}</div>`;
    html += `<div class="method-note">بزرگ‌ترین عدد مشترک در هر دو فهرست (رنگی‌شده) همان ب.م.م است = <b>${g}</b></div>`;
  }else{
    html += `<div class="method-note">برای اعداد بزرگ‌تر از ${GCD_STEP_LIMIT.toLocaleString('en-US')} فهرست کامل مقسوم‌علیه‌ها نمایش داده نمی‌شود.</div>`;
  }
  const capMult=12;
  const termsA=Math.min(capMult, Math.max(1,Math.round(l/a)));
  const termsB=Math.min(capMult, Math.max(1,Math.round(l/b)));
  const ma=Array.from({length:termsA},(_,i)=>a*(i+1));
  const mb=Array.from({length:termsB},(_,i)=>b*(i+1));
  const chipRow2=arr=>`<div class="chip-row">${arr.map(x=>`<span class="chip${x===l?' hit':''}">${x}</span>`).join('')}</div>`;
  html += `<div class="list-box"><div class="list-title">چند مضرب اول ${a}</div>${chipRow2(ma)}</div>`;
  html += `<div class="list-box"><div class="list-title">چند مضرب اول ${b}</div>${chipRow2(mb)}</div>`;
  html += `<div class="method-note">اولین عددی که در فهرست مضرب‌های هر دو دیده می‌شود (رنگی‌شده، یا اگر در این چند مورد نبود، ادامهٔ الگو) همان ک.م.م است = <b>${l}</b></div>`;
  html += `</div>`;
  return html;
}

function screenLcmGcd(root){
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">ک.م.م و ب.م.م</div>
      <div class="panel-sub">دو عدد صحیح وارد کن؛ جواب و سه روش حل گام‌به‌گامش رو با هم می‌بینی</div>
      <div class="row2">
        ${fieldHTML('lA','عدد اول')}
        ${fieldHTML('lB','عدد دوم')}
      </div>
      <button class="solve-btn" id="lBtn">محاسبه هر دو</button>
    </div>
  `;
  const panel = root.querySelector('.panel');
  root.querySelector('#lBtn').onclick=()=>{
    let a=Math.round(num('lA')), b=Math.round(num('lB'));
    if(isNaN(a)||isNaN(b)||a===0||b===0) return showError(panel,'لطفاً دو عدد صحیح غیرصفر وارد کن.');
    a=Math.abs(a); b=Math.abs(b);
    const g = gcd(a,b), l = lcm(a,b);
    let box = panel.querySelector('.result-box'); if(box) box.remove();
    box = document.createElement('div');
    box.className='result-box';
    box.innerHTML = `<div class="rlabel">نتیجه</div><div class="rvalue">ب.م.م = ${g} &nbsp;|&nbsp; ک.م.م = ${l}</div>`
      + renderLadderMethod(a,b,g,l)
      + renderTreeMethod(a,b,g,l)
      + renderListMethod(a,b,g,l);
    panel.appendChild(box);
  };
}

/* ---- قواعد بخش‌پذیری (مفهوم مرتبط با ب.م.م/ک.م.م) ---- */

    <div class="panel">

      <div class="panel-sub">یک عدد صحیح وارد کن تا بخش‌پذیری آن بر ۲ تا ۱۲ را همراه با قاعده‌اش ببینی</div>

      <button class="solve-btn" id="dvB">بررسی کن</button>

  `;
  const panel = root.querySelector('.panel');
  root.querySelector('#dvB').onclick=()=>{
    let n = Math.round(num('dvN'));
    if(isNaN(n)) return showError(panel,'یک عدد صحیح معتبر وارد کن.');
    n = Math.abs(n);
    const digits = String(n).split('').map(Number);
    const digitSum = digits.reduce((s,d)=>s+d,0);
    let altSum=0; digits.slice().reverse().forEach((d,i)=> altSum += (i%2===0? d : -d));
    const last2 = n%100, last3=n%1000, lastDigit=n%10;
    const rules=[
      [2, n%2===0, 'رقم یکان زوج باشد (۰، ۲، ۴، ۶ یا ۸)'],
      [3, digitSum%3===0, `مجموع رقم‌ها بر ۳ بخش‌پذیر باشد — مجموع رقم‌ها = ${digitSum}`],
      [4, last2%4===0, `دو رقم آخر (${String(last2).padStart(2,'0')}) بر ۴ بخش‌پذیر باشد`],
      [5, lastDigit===0||lastDigit===5, 'رقم یکان ۰ یا ۵ باشد'],
      [6, n%2===0 && digitSum%3===0, 'هم بر ۲ و هم بر ۳ بخش‌پذیر باشد'],
      [8, last3%8===0, `سه رقم آخر (${String(last3).padStart(3,'0')}) بر ۸ بخش‌پذیر باشد`],
      [9, digitSum%9===0, `مجموع رقم‌ها بر ۹ بخش‌پذیر باشد — مجموع رقم‌ها = ${digitSum}`],
      [10, lastDigit===0, 'رقم یکان ۰ باشد'],
      [11, altSum%11===0, `مجموع متناوب رقم‌ها (از یکان) بر ۱۱ بخش‌پذیر باشد — مجموع متناوب = ${altSum}`],
      [12, n%3===0 && n%4===0, 'هم بر ۳ و هم بر ۴ بخش‌پذیر باشد']
    ];
    let box = panel.querySelector('.result-box'); if(box) box.remove();
    box = document.createElement('div');
    box.className='result-box';
    box.innerHTML = `<div class="rlabel">نتیجه برای عدد ${n}</div>`
      + rules.map(([k,ok,rule])=>`<div class="divis-row"><div class="dv-rule">بخش‌پذیری بر ${k}: ${rule}</div><div class="dv-badge ${ok?'yes':'no'}">${ok?'بله':'خیر'}</div></div>`).join('');
    panel.appendChild(box);
  };
}

/* ============ FRACTIONS ============ */
function screenFractions(root){
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">کسرها</div>
      <div class="panel-sub">دو کسر رو وارد کن و عملیات رو انتخاب کن</div>
      <div class="row2">
        ${fieldHTML('f1n','صورت کسر اول')}
        ${fieldHTML('f1d','مخرج کسر اول')}
      </div>
      <div class="row2">
        ${fieldHTML('f2n','صورت کسر دوم')}
        ${fieldHTML('f2d','مخرج کسر دوم')}
      </div>
      <div class="field">
        <label>عملیات</label>
        <select id="fOp">
          <option value="+">جمع</option>
          <option value="-">تفریق</option>
          <option value="*">ضرب</option>
          <option value="/">تقسیم</option>
        </select>
      </div>
      <button class="solve-btn" id="fBtn">محاسبه و ساده‌سازی</button>
    </div>
  `;
  const panel = root.querySelector('.panel');
  root.querySelector('#fBtn').onclick=()=>{
    const n1=Math.round(num('f1n')), d1=Math.round(num('f1d'));
    const n2=Math.round(num('f2n')), d2=Math.round(num('f2d'));
    const op=document.getElementById('fOp').value;
    if([n1,d1,n2,d2].some(isNaN) || d1===0 || d2===0) return showError(panel,'لطفاً مقادیر معتبر وارد کن (مخرج نباید صفر باشد).');
    let rn, rd;
    if(op==='+'){ rn=n1*d2+n2*d1; rd=d1*d2; }
    else if(op==='-'){ rn=n1*d2-n2*d1; rd=d1*d2; }
    else if(op==='*'){ rn=n1*n2; rd=d1*d2; }
    else { if(n2===0) return showError(panel,'تقسیم بر کسر صفر ممکن نیست.'); rn=n1*d2; rd=d1*n2; }
    if(rd<0){ rd=-rd; rn=-rn; }
    const g = gcd(rn,rd)||1;
    const sn = rn/g, sd = rd/g;
    showResult(panel, `${sn} / ${sd}`, `(${n1}/${d1}) ${{'+':'+','-':'−','*':'×','/':'÷'}[op]} (${n2}/${d2}) = ${sn}/${sd} ${sd!==0? '  (≈ '+fmtNum(sn/sd)+')':''}`);
  };
}

/* ============ 2D SHAPES ============ */
const SHAPES_2D = {
  square:{label:'مربع', fields:[['s','ضلع']], calc:(v)=>({area:v.s*v.s, per:4*v.s, af:`ضلع × ضلع = ${v.s} × ${v.s}`, pf:`4 × ضلع = 4 × ${v.s}`})},
  rect:{label:'مستطیل', fields:[['a','طول'],['b','عرض']], calc:(v)=>({area:v.a*v.b, per:2*(v.a+v.b), af:`طول × عرض = ${v.a} × ${v.b}`, pf:`۲×(طول+عرض) = 2×(${v.a}+${v.b})`})},
  triangle:{label:'مثلث', fields:[['base','قاعده'],['h','ارتفاع'],['s1','ضلع ۱'],['s2','ضلع ۲']], calc:(v)=>({area:(v.base*v.h)/2, per:v.base+v.s1+v.s2, af:`(قاعده × ارتفاع)/۲ = (${v.base}×${v.h})/2`, pf:`مجموع سه ضلع = ${v.base}+${v.s1}+${v.s2}`})},
  circle:{label:'دایره', fields:[['r','شعاع']], calc:(v)=>({area:Math.PI*v.r*v.r, per:2*Math.PI*v.r, af:`π × شعاع² = π × ${v.r}²`, pf:`۲πr = 2×π×${v.r}`})},
  parallelogram:{label:'متوازی‌الاضلاع', fields:[['base','قاعده'],['h','ارتفاع'],['side','ضلع مجاور']], calc:(v)=>({area:v.base*v.h, per:2*(v.base+v.side), af:`قاعده × ارتفاع = ${v.base}×${v.h}`, pf:`۲×(قاعده+ضلع مجاور)`})},
  trapezoid:{label:'ذوزنقه', fields:[['b1','قاعده بزرگ'],['b2','قاعده کوچک'],['h','ارتفاع'],['s1','ضلع ۱'],['s2','ضلع ۲']], calc:(v)=>({area:((v.b1+v.b2)*v.h)/2, per:v.b1+v.b2+v.s1+v.s2, af:`((قاعده بزرگ+قاعده کوچک)×ارتفاع)/۲`, pf:`مجموع چهار ضلع`})},
  rhombus:{label:'لوزی', fields:[['d1','قطر ۱'],['d2','قطر ۲'],['s','ضلع']], calc:(v)=>({area:(v.d1*v.d2)/2, per:4*v.s, af:`(قطر۱×قطر۲)/۲ = (${v.d1}×${v.d2})/2`, pf:`4 × ضلع = 4×${v.s}`})}
};
function screenShape2D(root){

/* ============ 3D SHAPES ============ */
const SHAPES_3D = {
  cube:{label:'مکعب', fields:[['s','ضلع']], calc:(v)=>({vol:v.s**3, area:6*v.s*v.s, vf:`ضلع³ = ${v.s}³`, af:`6 × ضلع² = 6×${v.s}²`})},
  cuboid:{label:'مکعب‌مستطیل', fields:[['a','طول'],['b','عرض'],['c','ارتفاع']], calc:(v)=>({vol:v.a*v.b*v.c, area:2*(v.a*v.b+v.b*v.c+v.a*v.c), vf:`طول×عرض×ارتفاع = ${v.a}×${v.b}×${v.c}`, af:`۲×(ab+bc+ac)`})},
  cylinder:{label:'استوانه', fields:[['r','شعاع قاعده'],['h','ارتفاع']], calc:(v)=>({vol:Math.PI*v.r*v.r*v.h, area:2*Math.PI*v.r*(v.r+v.h), vf:`π×شعاع²×ارتفاع = π×${v.r}²×${v.h}`, af:`۲πr(r+h)`})},
  sphere:{label:'کره', fields:[['r','شعاع']], calc:(v)=>({vol:(4/3)*Math.PI*v.r**3, area:4*Math.PI*v.r*v.r, vf:`(۴/۳)×π×شعاع³ = (4/3)×π×${v.r}³`, af:`4πr² = 4×π×${v.r}²`})},
  cone:{label:'مخروط', fields:[['r','شعاع قاعده'],['h','ارتفاع'],['l','ارتفاع مایل (اختیاری)']], calc:(v)=>{ const l = v.l>0? v.l : Math.sqrt(v.r*v.r+v.h*v.h); return {vol:(1/3)*Math.PI*v.r*v.r*v.h, area:Math.PI*v.r*(v.r+l), vf:`(۱/۳)×π×شعاع²×ارتفاع`, af:`πr(r+l) — l = مولد مخروط ≈ ${fmtNum(l)}`}; }},
  pyramid:{label:'هرم چهارضلعی (قاعده مربع)', fields:[['s','ضلع قاعده'],['h','ارتفاع']], calc:(v)=>{
    const l = Math.sqrt(v.h*v.h + (v.s/2)*(v.s/2)); // ارتفاع مایل هر وجه جانبی
    const area = v.s*v.s + 2*v.s*l;
    return {vol:(1/3)*v.s*v.s*v.h, area, vf:`(۱/۳)×مساحت قاعده×ارتفاع = (1/3)×${v.s}²×${v.h}`, af:`مساحت قاعده + ۴×مساحت وجه جانبی = ${v.s}² + 2×${v.s}×${fmtNum(l)}`};
  }}
};

      const val = parseFloat(raw.replace(/,/g,'.'));
      if(isNaN(val) || val<0) return showError(panel,'لطفاً مقادیر را به‌صورت عدد مثبت وارد کن.');

/* ============ SCIENTIFIC CALCULATOR (button grid) ============ */
function screenSciCalc(root){
  let expr = '';
  let memory = 0;
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">ماشین‌حساب علمی</div>
      <div class="panel-sub">با دکمه‌ها عبارت رو بساز؛ sin/cos/tan بر حسب درجه محاسبه می‌شن</div>
      <div class="sci-display">
        <div class="expr" id="sciExpr">&nbsp;</div>
        <div class="val" id="sciVal"><span class="sci-mem-badge" id="sciMemBadge"></span>0</div>
      </div>
      <div class="sci-grid" id="sciGrid"></div>
    </div>
  `;
  const panel = root.querySelector('.panel');
  const exprEl = root.querySelector('#sciExpr');
  const valEl = root.querySelector('#sciVal');
  const memBadge = root.querySelector('#sciMemBadge');
  const grid = root.querySelector('#sciGrid');

  const BTNS = [
    {label:'MC',cls:'mem',act:()=>{memory=0; updateMem();}},
    {label:'MR',cls:'mem',act:()=>{expr+= (memory<0?`(${fmtNum(memory)})`:fmtNum(memory)); render();}},
    {label:'M+',cls:'mem',act:()=>{const v=tryEval(); if(v!==null){memory+=v; updateMem();}}},
    {label:'M−',cls:'mem',act:()=>{const v=tryEval(); if(v!==null){memory-=v; updateMem();}}},
    {label:'AC',cls:'clear',act:()=>{expr=''; render();}},
    {label:'sin',cls:'fn',act:()=>{expr+='sin('; render();}},
    {label:'cos',cls:'fn',act:()=>{expr+='cos('; render();}},
    {label:'tan',cls:'fn',act:()=>{expr+='tan('; render();}},
    {label:'log',cls:'fn',act:()=>{expr+='log('; render();}},
    {label:'ln',cls:'fn',act:()=>{expr+='ln('; render();}},
    {label:'(',cls:'',act:()=>{expr+='('; render();}},
    {label:')',cls:'',act:()=>{expr+=')'; render();}},
    {label:'√',cls:'fn',act:()=>{expr+='sqrt('; render();}},
    {label:'x²',cls:'fn',act:()=>{expr+='^2'; render();}},
    {label:'xʸ',cls:'fn',act:()=>{expr+='^'; render();}},
    {label:'7',cls:'',act:()=>{expr+='7'; render();}},
    {label:'8',cls:'',act:()=>{expr+='8'; render();}},
    {label:'9',cls:'',act:()=>{expr+='9'; render();}},
    {label:'÷',cls:'op',act:()=>{expr+='/'; render();}},
    {label:'⌫',cls:'clear',act:()=>{expr=expr.slice(0,-1); render();}},
    {label:'4',cls:'',act:()=>{expr+='4'; render();}},
    {label:'5',cls:'',act:()=>{expr+='5'; render();}},
    {label:'6',cls:'',act:()=>{expr+='6'; render();}},
    {label:'×',cls:'op',act:()=>{expr+='*'; render();}},
    {label:'π',cls:'fn',act:()=>{expr+='pi'; render();}},
    {label:'1',cls:'',act:()=>{expr+='1'; render();}},
    {label:'2',cls:'',act:()=>{expr+='2'; render();}},
    {label:'3',cls:'',act:()=>{expr+='3'; render();}},
    {label:'−',cls:'op',act:()=>{expr+='-'; render();}},
    {label:'%',cls:'op',act:()=>{expr+='/100'; render();}},
    {label:'0',cls:'',act:()=>{expr+='0'; render();}},
    {label:'.',cls:'',act:()=>{expr+='.'; render();}},
    {label:'±',cls:'',act:()=>{expr = expr ? `-(${expr})` : ''; render();}},
    {label:'+',cls:'op',act:()=>{expr+='+'; render();}},
    {label:'=',cls:'eq',act:()=>{ const v=tryEval(); if(v!==null){ exprEl.textContent = expr + ' ='; expr = fmtNum(v); render(true);} }}
  ];
  grid.innerHTML = BTNS.map((b,idx)=>`<button class="sci-btn ${b.cls}" data-i="${idx}">${b.label}</button>`).join('');
  grid.querySelectorAll('.sci-btn').forEach(btn=>{
    btn.onclick = ()=> BTNS[+btn.dataset.i].act();
  });

  function tryEval(){
    if(!expr.trim()) return null;
    try{ return evalExpr(expr); }
    catch(e){ valEl.innerHTML = `<span class="sci-mem-badge" id="sciMemBadge"></span><span style="color:var(--rose); font-size:15px;">${e.message}</span>`; return null; }
  }
  function updateMem(){
    memBadge.textContent = memory!==0 ? 'M' : '';
  }
  function render(keepExprLabel){
    if(!keepExprLabel) exprEl.textContent = expr || '\u00a0';
    const v = (()=>{ try{ return expr.trim()? evalExpr(expr) : null; }catch(e){ return null; } })();
    valEl.innerHTML = `<span class="sci-mem-badge" id="sciMemBadge">${memory!==0?'M':''}</span>${v!==null? fmtNum(v) : (expr||'0')}`;
  }
  render();
}

    const nums = raw.split(/[,،\s]+/).map(x=>parseFloat(x.replace(/,/g,'.'))).filter(x=>!isNaN(x));
    if(nums.length===0) return showError(panel,'لطفاً حداقل یک عدد معتبر وارد کن.');
    const n = nums.length;
    const mean = nums.reduce((a,b)=>a+b,0)/n;
    const sorted = [...nums].sort((a,b)=>a-b);
    const median = n%2===1 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
    const freq = {};
    nums.forEach(x=>freq[x]=(freq[x]||0)+1);
    const maxFreq = Math.max(...Object.values(freq));
    const modes = Object.keys(freq).filter(k=>freq[k]===maxFreq).map(Number);
    const modeStr = maxFreq>1 ? modes.map(fmtNum).join('، ') : 'بدون نما تکراری (همه یکتا هستند)';
    const range = sorted[n-1]-sorted[0];
    showResult(panel, `میانگین: ${fmtNum(mean)}`,
      `میانه (وسطی): ${fmtNum(median)}<br>نما (پرتکرارترین): ${modeStr}<br>دامنه (بیشینه−کمینه): ${fmtNum(range)}<br>تعداد داده‌ها: ${n}`);
  };
}

/* ============ WORD PROBLEM SOLVER ============ */
const WP_OPS = [
  {op:'+', words:['اضافه شد','اضافه کرد','بعلاوه','به‌علاوه','با هم','روی هم','روی‌هم','جمعاً','جمعا','بدست آورد','به‌دست آورد','دریافت کرد','پیدا کرد','برنده شد','هدیه گرفت','خرید','گرفت','جمع']},
  {op:'-', words:['از دست داد','گم کرد','فروخت','خورد','برداشت','کم شد','کسر شد','باقی ماند','دور ریخت','شکست','داد به','منها','تفریق']},
  {op:'*', words:['ضرب در','هر کدام','هر کدوم','هر یک','قیمت هر','برابر','ضرب']},
  {op:'/', words:['تقسیم بر','تقسیم شد','به طور مساوی','هر نفر','سهم هر','بین','تقسیم']}
];
function solveWordProblem(text){
  let t = text.replace(/\u200c/g,'').split('').map(ch=>FA_DIGITS[ch]||ch).join('');
  const escapeRe = w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const kwParts = [];
  WP_OPS.forEach(group=>{
    group.words.forEach(w=> kwParts.push({re:escapeRe(w), op:group.op, len:w.length}));
  });
  kwParts.sort((a,b)=>b.len-a.len);
  const kwAlt = kwParts.map(k=>k.re).join('|');
  const master = new RegExp(`(${kwAlt})|(\\d+(?:\\.\\d+)?)`,'g');
  let result = null, steps = [], currentOp = null, m;
  while((m = master.exec(t)) !== null){
    if(m[1]!==undefined){
      const found = kwParts.find(k=>new RegExp('^'+k.re+'$').test(m[1]));
      if(found) currentOp = found.op;
    } else if(m[2]!==undefined){
      const value = parseFloat(m[2]);
      if(result===null){
        result = value;
        steps.push(`شروع: ${fmtNum(value)}`);
      } else {
        const op = currentOp || '+';
        const sym = {'+':'+','-':'−','*':'×','/':'÷'}[op];
        if(op==='/' && value===0) throw new Error('در متن تقسیم بر صفر رخ داده که ممکن نیست.');
        const before = result;
        if(op==='+') result += value;
        else if(op==='-') result -= value;
        else if(op==='*') result *= value;
        else result /= value;
        steps.push(`${sym} ${fmtNum(value)}  →  ${fmtNum(before)} ${sym} ${fmtNum(value)} = ${fmtNum(result)}`);
      }
      currentOp = null;
    }
  }
  if(result===null) throw new Error('هیچ عددی در متن پیدا نشد. لطفاً از رقم (نه حروف) برای اعداد استفاده کن.');
  return {result, steps};
}
function screenWordProblem(root){
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">حل مسئله متنی</div>
      <div class="panel-sub">متن مسئله رو بنویس؛ عدد‌ها رو با رقم بنویس (مثلاً 5 نه پنج) تا بهتر تشخیص بدم</div>
      <div class="field">
        <textarea class="word-textarea" id="wpText" placeholder="مثلاً: علی 12 تا سیب داشت. 5 تا سیب دیگر خرید. بعد 4 تا از سیب‌هایش را به دوستش داد. علی الان چند سیب دارد؟"></textarea>
      </div>
      <button class="solve-btn" id="wpBtn">حل کن</button>
      <div class="panel-sub" style="margin-top:14px; margin-bottom:0;">این یک تشخیص‌دهنده‌ی ساده‌ی الگوهاست، نه هوش مصنوعی کامل؛ مراحل زیر جواب رو نشونت می‌دم تا خودت هم بررسی کنی.</div>
    </div>
  `;
  const panel = root.querySelector('.panel');
  root.querySelector('#wpBtn').onclick=()=>{
    const text = document.getElementById('wpText').value.trim();
    if(!text) return showError(panel,'لطفاً متن مسئله را بنویس.');
    try{
      const {result, steps} = solveWordProblem(text);
      let box = panel.querySelector('.result-box'); if(box) box.remove();
      box = document.createElement('div');
      box.className='result-box';
      box.innerHTML = `<div class="rlabel">نتیجه</div><div class="rvalue">${fmtNum(result)}</div>
        <div class="steps-list">${steps.map(s=>`<div class="step">${s}</div>`).join('')}</div>`;
      panel.appendChild(box);
    }catch(e){
      showError(panel, e.message || 'نتونستم این مسئله رو تحلیل کنم.');
    }
  };
}

function screenVocab(root, lang){
  const VOCAB = lang==='en' ? EN_VOCAB : AR_VOCAB;
  const title = lang==='en' ? 'واژگان انگلیسی' : 'واژگان عربی';
  const cats = Object.keys(VOCAB);
  let activeCat = 'همه';
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">${title}</div>
      <div class="panel-sub">جستجو کن یا یک دسته رو انتخاب کن</div>
      <input class="field-input vocab-search" id="vSearch" type="text" placeholder="جستجوی واژه یا معنی..." style="width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:11px 12px; font-family:inherit; font-size:14px;">
      <div class="shape-picker" id="vCats"></div>
      <div class="vocab-count" id="vCount"></div>
      <div class="vocab-list" id="vList"></div>
    </div>
  `;
  const catsEl = root.querySelector('#vCats');
  const listEl = root.querySelector('#vList');
  const countEl = root.querySelector('#vCount');
  const searchEl = root.querySelector('#vSearch');

  function allEntries(){
    let out = [];
    for(const c of cats){
      if(activeCat!=='همه' && activeCat!==c) continue;
      VOCAB[c].forEach(([w,t])=>out.push([w,t,c]));
    }
    return out;
  }
  function render(){
    const q = searchEl.value.trim().toLowerCase();
    let entries = allEntries();
    if(q) entries = entries.filter(([w,t])=>w.toLowerCase().includes(q) || t.includes(q));
    countEl.textContent = `${entries.length} واژه`;
    listEl.innerHTML = entries.map(([w,t])=>`<div class="vocab-row"><span class="w">${w}</span><span class="t">${t}</span></div>`).join('') || '<div class="vocab-row" style="justify-content:center; color:var(--ink-dim);">چیزی پیدا نشد</div>';
  }
  function renderCats(){
    const all = ['همه', ...cats];
    catsEl.innerHTML = all.map(c=>`<button class="shape-chip ${c===activeCat?'active':''}" data-c="${c}">${c}</button>`).join('');
    catsEl.querySelectorAll('.shape-chip').forEach(chip=>{
      chip.onclick=()=>{ activeCat=chip.dataset.c; renderCats(); render(); };
    });
  }
  renderCats(); render();
  searchEl.addEventListener('input', render);
}

function screenTranslator(root){
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">مترجم ساده کلمه‌به‌کلمه</div>
      <div class="panel-sub">این مترجم بر اساس واژه‌نامه‌ی همین برنامه کار می‌کند، نه ترجمه کامل و دستوری — برای جمله‌های ساده و تک‌کلمه‌ای مناسب‌تره</div>
      <div class="field">
        <label>جهت ترجمه</label>
        <select id="trDir">
          <option value="fa-en">فارسی → انگلیسی</option>
          <option value="en-fa">انگلیسی → فارسی</option>
          <option value="fa-ar">فارسی → عربی</option>
          <option value="ar-fa">عربی → فارسی</option>
        </select>
      </div>
      <div class="field">
        <label>متن</label>
        <textarea class="word-textarea" id="trText" placeholder="مثلاً: سلام دوست من"></textarea>
      </div>
      <button class="solve-btn" id="trBtn">ترجمه کن</button>
    </div>
  `;
  const panel = root.querySelector('.panel');
  function faToX(map){
    const rev = {};
    for(const c in map) map[c].forEach(([w,t])=>{ if(!(t in rev)) rev[t]=w; });
    return rev;
  }
  function xToFa(map){
    const fwd = {};
    for(const c in map) map[c].forEach(([w,t])=>{ fwd[w.toLowerCase()]=t; });
    return fwd;
  }
  root.querySelector('#trBtn').onclick=()=>{
    const dir = document.getElementById('trDir').value;
    const text = document.getElementById('trText').value.trim();
    if(!text) return showError(panel,'لطفاً یک متن وارد کن.');
    let words = text.split(/\s+/);
    let out, misses=0;
    if(dir==='en-fa'){ const d=xToFa(EN_VOCAB); out=words.map(w=>{const k=w.toLowerCase().replace(/[.,!?]/g,''); if(d[k])return d[k]; misses++; return w;}); }
    else if(dir==='ar-fa'){ const d=xToFa(AR_VOCAB); out=words.map(w=>{const k=w.replace(/[.,!?]/g,''); if(d[k])return d[k]; misses++; return w;}); }
    else if(dir==='fa-en'){ const d=faToX(EN_VOCAB); out=words.map(w=>{const k=w.replace(/[.,!?،]/g,''); if(d[k])return d[k]; misses++; return w;}); }
    else { const d=faToX(AR_VOCAB); out=words.map(w=>{const k=w.replace(/[.,!?،]/g,''); if(d[k])return d[k]; misses++; return w;}); }
    const resultText = out.join(' ');
    let box = panel.querySelector('.result-box'); if(box) box.remove();
    box = document.createElement('div');
    box.className='result-box';
    box.innerHTML = `<div class="rlabel">ترجمه تقریبی</div><div class="rvalue" style="font-size:17px; direction:${dir.endsWith('en')||dir.endsWith('ar')?'ltr':'rtl'};">${nbEsc(resultText)}</div>${misses>0?`<div class="rformula">${misses} واژه در واژه‌نامه پیدا نشد و بدون تغییر باقی ماند.</div>`:''}`;
    panel.appendChild(box);
  };
}

    ['Should / Ought to','You should rest.','توصیه و پیشنهاد.'],
    ['First Conditional','If it rains, I will stay home.','If + present, will + base؛ شرط واقعی یا محتمل.'],
    ['Second Conditional','If I had time, I would travel.','شرط فرضی؛ if + past, would + base.'],
    ['Third Conditional','If I had studied, I would have passed.','شرط غیرواقعی درباره گذشته.'],
    ['Zero Conditional','If you heat ice, it melts.','حقیقت عمومی؛ if + present, present.'],

    ['Articles: a/an','I saw a cat.','برای یک مورد نامشخص؛ an قبل از صدای واکه.'],
    ['Article: the','The cat is on the table.','برای چیزی مشخص یا قبلاً شناخته‌شده.'],

  q.oninput=render;render();
