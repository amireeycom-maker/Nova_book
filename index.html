function screenQuadratic(root){
 root.innerHTML=`<div class="panel"><div class="panel-title">معادله درجه دو</div><div class="panel-sub">ax² + bx + c = 0</div><div class="row3">${fieldHTML('qa','a')}${fieldHTML('qb','b')}${fieldHTML('qc','c')}</div><button class="solve-btn" id="qBtn">حل معادله</button></div>`;
 const p=root.querySelector('.panel');root.querySelector('#qBtn').onclick=()=>{const a=num('qa'),b=num('qb'),c=num('qc');if([a,b,c].some(isNaN)||a===0)return showError(p,'a باید عددی غیرصفر باشد.');const d=b*b-4*a*c;if(d>0){const x1=(-b+Math.sqrt(d))/(2*a),x2=(-b-Math.sqrt(d))/(2*a);showResult(p,`x₁ = ${fmtNum(x1)} ، x₂ = ${fmtNum(x2)}`,`Δ = ${fmtNum(d)}`);}else if(d===0){showResult(p,`x = ${fmtNum(-b/(2*a))}`,`Δ = 0`);}else showResult(p,'ریشهٔ حقیقی ندارد',`Δ = ${fmtNum(d)} < 0`);};
}
function screenSystem2(root){
 root.innerHTML=`<div class="panel"><div class="panel-title">دستگاه دو معادله دو مجهولی</div><div class="panel-sub">a₁x+b₁y=c₁ و a₂x+b₂y=c₂</div><div class="row2">${fieldHTML('s1a','a₁')}${fieldHTML('s1b','b₁')}${fieldHTML('s1c','c₁')}${fieldHTML('s2a','a₂')}${fieldHTML('s2b','b₂')}${fieldHTML('s2c','c₂')}</div><button class="solve-btn" id="sBtn">حل دستگاه</button></div>`;
 const p=root.querySelector('.panel');root.querySelector('#sBtn').onclick=()=>{const [a,b,c,d,e,f]=['s1a','s1b','s1c','s2a','s2b','s2c'].map(num);if([a,b,c,d,e,f].some(isNaN))return showError(p,'همه ضرایب را وارد کن.');const D=a*e-b*d,Dx=c*e-b*f,Dy=a*f-c*d;if(D===0)return showResult(p,Dx===0&&Dy===0?'بی‌نهایت جواب یا دستگاه وابسته است':'دستگاه جواب یکتا ندارد',`Δ = ${D}`);showResult(p,`x = ${fmtNum(Dx/D)} ، y = ${fmtNum(Dy/D)}`,`Δ = ${D}`);};
}
function screenAdvancedStats(root){
 root.innerHTML=`<div class="panel"><div class="panel-title">آمار پیشرفته</div><div class="panel-sub">اعداد را با فاصله یا ویرگول جدا کن</div><div class="field"><label>داده‌ها</label><input id="asData" placeholder="2, 4, 4, 6, 8"></div><button class="solve-btn" id="asBtn">محاسبه</button></div>`;const p=root.querySelector('.panel');root.querySelector('#asBtn').onclick=()=>{const a=root.querySelector('#asData').value.split(/[,،\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(Number.isFinite);if(!a.length)return showError(p,'داده معتبر وارد کن.');const m=a.reduce((x,y)=>x+y,0)/a.length,v=a.reduce((x,y)=>x+(y-m)**2,0)/a.length;showResult(p,`میانگین: ${fmtNum(m)}`,`مجموع: ${fmtNum(a.reduce((x,y)=>x+y,0))}<br>واریانس جامعه: ${fmtNum(v)}<br>انحراف معیار: ${fmtNum(Math.sqrt(v))}<br>کمینه: ${fmtNum(Math.min(...a))} — بیشینه: ${fmtNum(Math.max(...a))}`);};
}

function renderBioListScreen(root, title, subtitle, data){
  root.innerHTML = `<div class="panel"><div class="panel-title">${title}</div><div class="panel-sub">${subtitle}</div><input class="vocab-search" id="bioSearch" placeholder="جستجو..." style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:14px;"><div class="vocab-list" id="bioList"></div></div>`;
  const q=root.querySelector('#bioSearch'), list=root.querySelector('#bioList');
  function render(){
    const x=q.value.trim();
    const entries = x? data.filter(([n,d])=>n.includes(x)||d.includes(x)) : data;
    list.innerHTML = entries.map(([n,d])=>`<div class="idiom-row"><div class="ph">${n}</div><div class="mn">${d}</div></div>`).join('') || '<div class="idiom-row">چیزی پیدا نشد</div>';
  }
  q.oninput=render; render();
}

  const cats=[['همه',0,ALL_BIO.length],['سلول و مولکول',0,30],['ژنتیک و تکامل',14,31],['بدن انسان',34,82],['گیاه و بوم‌شناسی',82,ALL_BIO.length]];
  root.innerHTML=`<div class="hero"><h2>زیست‌شناسی — دانشنامهٔ گسترده</h2>
    <p>اکنون بیش از ۱۵۰ مفهوم از سلول و ژنتیک تا بدن انسان، گیاهان، بوم‌شناسی و تکامل در یک بخش قابل جستجو قرار گرفته است.</p></div>
    <div class="bio-toolbar"><input class="country-search" id="bioSearch" placeholder="جستجوی مفهوم، سلول، ژنتیک، بدن، گیاه..."><select class="bio-filter" id="bioFilter">${cats.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></div>
    <div class="bio-grid" id="bioList"></div>`;
  const list=root.querySelector('#bioList'),search=root.querySelector('#bioSearch'),filter=root.querySelector('#bioFilter');
  function render(){
    const q=search.value.trim().toLowerCase(), idx=+filter.value, range=cats[idx];
    const arr=ALL_BIO.filter((x,i)=>(idx===0||i>=range[1]&&i<range[2]) && (!q||x.join(' ').toLowerCase().includes(q)));
    list.innerHTML=arr.map((x,i)=>`<button class="bio-topic" data-k="${ALL_BIO.indexOf(x)}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')||'<div class="panel">مفهومی پیدا نشد.</div>';
    list.querySelectorAll('.bio-topic').forEach(b=>b.onclick=()=>{
      const x=ALL_BIO[+b.dataset.k];
      const name=x[0], desc=x[1];
      const lines=[
        `تعریف: ${desc}`,
        `اهمیت: این مفهوم را می‌توان در کنار مفاهیم سلولی، مولکولی، فیزیولوژیک یا بوم‌شناختی مرتبط مطالعه کرد تا ارتباط میان بخش‌های مختلف زیست‌شناسی روشن‌تر شود.`,
        `سازوکار: در مطالعهٔ این موضوع باید ورودی‌ها، فرایندهای اصلی، عوامل مؤثر و نتیجهٔ نهایی را از هم جدا کرد. این روش کمک می‌کند مفهوم به‌صورت علت و معلول فهمیده شود.`,
        `ارتباط با بدن یا محیط: بسیاری از فرایندهای زیستی در یک شبکه به‌هم‌پیوسته رخ می‌دهند؛ تغییر یک جزء می‌تواند بر اجزای دیگر اثر بگذارد.`,
        `نکتهٔ یادگیری: برای تثبیت ${name}، تعریف را بخوان، یک مثال واقعی پیدا کن، سپس آن را با یک مفهوم نزدیک مقایسه کن.`,
        `جمع‌بندی: ${name} یکی از اجزای شبکهٔ بزرگ‌تر زیست‌شناسی است و فهم آن زمانی کامل‌تر می‌شود که ساختار، عملکرد و ارتباط آن با سایر فرایندها کنار هم دیده شوند.`
      ];
      detailPanel(root,name,[['دسته','زیست‌شناسی'],['شماره در دانشنامه',String(ALL_BIO.indexOf(x)+1)],['مفهوم پایه',desc]],{lines});
    });
  }
  search.oninput=render;filter.onchange=render;render();
}

function screenPhysicsFormula(root, cfg){
  root.innerHTML = `
    <div class="panel">
      <div class="panel-title">${cfg.label}</div>
      <div class="panel-sub" style="direction:ltr; text-align:right;">فرمول: ${cfg.formula}</div>
      ${cfg.fields.map(([id,label])=>fieldHTML('ph_'+id,label)).join('')}
      <button class="solve-btn" id="phBtn">محاسبه</button>
    </div>
  `;
  const panel = root.querySelector('.panel');
  root.querySelector('#phBtn').onclick=()=>{
    const v = {};
    for(const [id] of cfg.fields){
      const val = num('ph_'+id);
      if(isNaN(val)) return showError(panel,'لطفاً همه مقادیر را به‌صورت عدد وارد کن.');
      v[id]=val;
    }
    const r = cfg.calc(v);
    showResult(panel, `${fmtNum(r)} ${cfg.unit}`, cfg.expl(v,r));
  };
}

می‌کنند."], ["زیست ۳۵: نورون", "نورون معمولاً پیام را از دندریت‌ها دریافت و از آکسون به سمت سلول هدف هدایت می‌کند."], ["زیست ۳۶: سیناپس", "سیناپس محل ارتباط عملکردی نورون با نورون دیگر یا سلول هدف است و می‌تواند شیمیایی یا الکتریکی باشد."], ["زیست ۳۷: دستگاه عصبی مرکزی", "مغز و نخاع دستگاه عصبی مرکزی را تشکیل می‌دهند و مرکز پردازش بسیاری از اطلاعات عصبی‌اند."], ["زیست ۳۸: دستگاه عصبی محیطی", "اعصاب و گانگلیون‌های خارج از مغز و نخاع، ارتباط دستگاه عصبی مرکزی با بدن را برقرار می‌کنند."], ["زیست ۳۹: انعکاس", "رفلکس پاسخ سریع و نسبتاً خودکار به محرک است که مسیر عصبی آن می‌تواند شامل نخاع باشد."], ["زیست ۴۰: لوب پیشانی", "لوب پیشانی در برنامه‌ریزی، تصمیم‌گیری، کنترل حرکات ارادی و برخی کارکردهای زبانی نقش دارد."], ["زیست ۴۱: لوب آهیانه‌ای", "این لوب در پردازش لمس و اطلاعات مکانی و یکپارچه‌سازی برخی داده‌های حسی نقش دارد."], ["زیست ۴۲: لوب گیجگاهی", "در پردازش شنوایی، حافظه و درک زبان نقش دارد."], ["زیست ۴۳: لوب پس‌سری", "لوب پس‌سری مرکز اصلی پردازش اطلاعات بینایی در قشر مغز است."], ["زیست ۴۴: مخچه", "مخچه در هماهنگی حرکات، تعادل و یادگیری حرکتی نقش دارد."], ["زیست ۴۵: ساقه مغز", "ساقه مغز مسیر ارتباطی مهم و تنظیم‌کننده برخی کارکردهای حیاتی مانند تنفس و ضربان قلب است."], ["زیست ۴۶: قلب", "قلب یک پمپ عضلانی است که خون را در گردش ریوی و عمومی به حرکت درمی‌آورد."], ["زیست ۴۷: دهلیزها", "دهلیزها حفره‌های بالایی قلب‌اند و خون را دریافت می‌کنند."], ["زیست ۴۸: بطن‌ها", "بطن‌ها حفره‌های پایینی‌اند و خون را از قلب به سمت ریه‌ها یا بدن پمپ می‌کنند."], ["زیست ۴۹: دریچه‌های قلب", "دریچه‌ها از برگشت خون جلوگیری می‌کنند و جریان خون را تا حد زیادی یک‌طرفه نگه می‌دارند."], ["زیست ۵۰: گردش ریوی", "در گردش ریوی خون بین قلب و ریه‌ها حرکت می‌کند تا تبادل گازها انجام شود."], ["زیست ۵۱: گردش عمومی", "در گردش عمومی خون از قلب به بافت‌های بدن می‌رود و سپس به قلب بازمی‌گردد."], ["زیست ۵۲: سرخرگ", "سرخرگ‌ها خون را از قلب دور می‌کنند؛ بسیاری از آن‌ها خون پر‌اکسیژن حمل می‌کنند اما سرخرگ ریوی استثناست."], ["زیست ۵۳: سیاهرگ", "سیاهرگ‌ها خون را به قلب برمی‌گردانند و بسیاری از آن‌ها دریچه‌هایی برای کمک به بازگشت خون دارند."], ["زیست ۵۴: مویرگ", "مویرگ‌ها دیواره بسیار نازکی دارند و محل مهم تبادل گازها، مواد غذایی و مواد زائد هستند."], ["زیست ۵۵: پلاسما", "پلاسما بخش مایع خون است و مواد محلول، پروتئین‌ها، هورمون‌ها و مواد زائد را جابه‌جا می‌کند."], ["زیست ۵۶: گلبول قرمز", "گلبول قرمز با هموگلوبین به حمل اکسیژن و بخشی از دی‌اکسیدکربن کمک می‌کند."], ["زیست ۵۷: گلبول سفید", "گلبول‌های سفید در دفاع ایمنی نقش دارند و انواع گوناگونی با کارکردهای متفاوت دارند."], ["زیست ۵۸: پلاکت", "پلاکت‌ها در فرایند انعقاد خون و تشکیل لخته برای جلوگیری از خونریزی مهم‌اند."], ["زیست ۵۹: دستگاه تنفس", "دستگاه تنفس اکسیژن را وارد بدن و دی‌اکسیدکربن را خارج می‌کند و در تبادل گازها نقش دارد."], ["زیست ۶۰: آلوئول", "آلوئول‌های ریه کیسه‌های هوایی فراوانی هستند که سطح بزرگی برای تبادل اکسیژن و دی‌اکسیدکربن فراهم می‌کنند."], ["زیست ۶۱: دیافراگم", "دیافراگم ماهیچه‌ای زیر ریه‌هاست و تغییر حجم قفسه سینه را در دم و بازدم ممکن می‌کند."], ["زیست ۶۲: تنفس سلولی", "تنفس سلولی مجموعه‌ای از واکنش‌ها برای استخراج انرژی از مواد غذایی و تولید ATP است."], ["زیست ۶۳: دستگاه گوارش", "گوارش غذا را خرد و مولکول‌های آن را برای جذب به شکل‌های قابل استفاده تبدیل می‌کند."], ["زیست ۶۴: دهان و بزاق", "جویدن سطح غذا را افزایش می‌دهد و بزاق به روان شدن غذا و آغاز هضم بعضی کربوهیدرات‌ها کمک می‌کند."], ["زیست ۶۵: معده", "معده غذا را مخلوط می‌کند و اسید و آنزیم‌های آن در هضم، به‌ویژه پروتئین‌ها، نقش دارند."], ["زیست ۶۶: روده باریک", "بیشتر هضم نهایی و جذب مواد غذایی در روده باریک انجام می‌شود و پرزها سطح جذب را افزایش می‌دهند."], ["زیست ۶۷: روده بزرگ", "روده بزرگ آب و برخی مواد را جذب می‌کند و در تشکیل و دفع مدفوع نقش دارد."], ["زیست ۶۸: کبد", "کبد در متابولیسم، ذخیره مواد، تولید صفرا و پردازش بسیاری از مواد جذب‌شده نقش دارد."], ["زیست ۶۹: لوزالمعده", "لوزالمعده آنزیم‌های گوارشی و هورمون‌هایی مانند انسولین و گلوکاگون تولید می‌کند."], ["زیست ۷۰: کلیه", "کلیه‌ها خون را پالایش می‌کنند و در تنظیم آب، یون‌ها و دفع مواد زائد از راه ادرار نقش دارند."], ["زیست ۷۱: نفرون", "نفرون واحد عملکردی کلیه است و فرایندهای تصفیه، بازجذب و ترشح در آن به تشکیل ادرار کمک می‌کنند."], ["زیست ۷۲: هورمون", "هورمون پیام‌رسان شیمیایی است که از سلول یا غده‌ای ترشح می‌شود و روی سلول‌های هدف اثر می‌گذارد."], ["زیست ۷۳: غدد درون‌ریز", "غدد درون‌ریز هورمون‌ها را وارد خون می‌کنند؛ هیپوفیز، تیروئید و فوق‌کلیه نمونه‌هایی از آن‌ها هستند."], ["زیست ۷۴: انسولین", "انسولین به سلول‌ها در دریافت و ذخیره گلوکز کمک می‌کند و معمولاً قند خون را کاهش می‌دهد."], ["زیست ۷۵: هم‌ایستایی", "هم‌ایستایی یعنی حفظ شرایط داخلی نسبتاً پایدار با وجود تغییرات محیطی؛ دمای بدن نمونه‌ای از آن است."], ["زیست ۷۶: دستگاه ایمنی", "دستگاه ایمنی عوامل بیگانه و سلول‌های غیرطبیعی را شناسایی و برای مقابله با آن‌ها پاسخ ایجاد می‌کند."], ["زیست ۷۷: پادتن", "پادتن یا آنتی‌بادی پروتئینی است که توسط برخی سلول‌های ایمنی ساخته می‌شود و به آنتی‌ژن‌های خاص متصل می‌شود."], ["زیست ۷۸: واکسن", "واکسن سیستم ایمنی را با یک آنتی‌ژن یا شکل بی‌خطر آن آشنا می‌کند تا پاسخ ایمنی و حافظه ایجاد شود."], ["زیست ۷۹: میکروب‌ها", "باکتری‌ها، ویروس‌ها، قارچ‌ها و برخی انگل‌ها می‌توانند در دسته عوامل میکروبی یا عفونی بررسی شوند."], ["زیست ۸۰: باکتری", "باکتری‌ها جانداران تک‌سلولی پروکاریوتی‌اند و برخی سودمند و برخی بیماری‌زا هستند."], ["زیست ۸۱: ویروس", "ویروس‌ها ساختارهای غیرسلولی‌اند که برای تکثیر به سلول میزبان وابسته‌اند."], ["زیست ۸۲: قارچ‌ها", "قارچ‌ها یوکاریوت هستند و نقش‌هایی مانند تجزیه مواد، همزیستی و ایجاد برخی بیماری‌ها دارند."], ["زیست ۸۳: گیاهان", "گیاهان جانداران یوکاریوتی فتوسنتزکننده‌اند و در بیشتر موارد دیواره سلولی و کلروپلاست دارند."], ["زیست ۸۴: فتوسنتز", "در فتوسنتز، انرژی نور به انرژی شیمیایی تبدیل می‌شود و در گیاهان دی‌اکسیدکربن و آب در ساخت مواد آلی نقش دارند."], ["زیست ۸۵: کلروپلاست", "کلروپلاست اندامک دارای رنگیزه‌های فتوسنتزی است و محل اصلی فتوسنتز در سلول گیاهی است."], ["زیست ۸۶: آوند چوبی", "آوند چوبی آب و یون‌های معدنی را عمدتاً از ریشه به بخش‌های بالایی گیاه منتقل می‌کند."], ["زیست ۸۷: آوند آبکش", "آوند آبکش مواد آلی تولیدشده در گیاه را از محل تولید یا ذخیره به محل‌های مصرف منتقل می‌کند."], ["زیست ۸۸: ریشه", "ریشه گیاه را در خاک نگه می‌دارد و در جذب آب و مواد معدنی و گاهی ذخیره مواد نقش دارد."], ["زیست ۸۹: ساقه", "ساقه اندام‌های هوایی را نگه می‌دارد و در انتقال مواد و گاهی ذخیره یا فتوسنتز نقش دارد."], ["زیست ۹۰: برگ", "برگ محل مهم فتوسنتز است و روزنه‌ها تبادل گاز و تنظیم بخشی از آب از راه تعرق را ممکن می‌کنند."], ["زیست ۹۱: تولیدمثل جنسی", "تولیدمثل جنسی با ترکیب ماده ژنتیکی والدین می‌تواند تنوع ژنتیکی فرزندان را افزایش دهد."], ["زیست ۹۲: تولیدمثل غیرجنسی", "در تولیدمثل غیرجنسی معمولاً یک والد دخالت دارد و فرزندان از نظر ژنتیکی بسیار شبیه والد هستند."], ["زیست ۹۳: وراثت", "وراثت انتقال اطلاعات ژنتیکی از والدین به فرزندان است و ژن‌ها و کروموزوم‌ها در آن نقش دارند."], ["زیست ۹۴: صفت غالب و مغلوب", "در مدل‌های ساده مندلی، آلل غالب می‌تواند در فنوتیپ اثر خود را در حضور آلل مغلوب نشان دهد؛ این قاعده همه صفات را توضیح نمی‌دهد."], ["زیست ۹۵: انتخاب طبیعی", "در انتخاب طبیعی، تفاوت‌های ارث‌پذیر و موفقیت متفاوت در بقا و تولیدمثل می‌تواند فراوانی صفات را در نسل‌ها تغییر دهد."], ["زیست ۹۶: سازگاری", "سازگاری ویژگی ارث‌پذیری است که در یک محیط می‌تواند به بقا یا تولیدمثل کمک کند."], ["زیست ۹۷: زنجیره غذایی", "زنجیره غذایی مسیر انتقال ماده و انرژی از تولیدکننده به مصرف‌کنندگان و سپس تجزیه‌کنندگان را نشان می‌دهد."], ["زیست ۹۸: شبکه غذایی", "شبکه غذایی چند زنجیره غذایی مرتبط را نشان می‌دهد و روابط تغذیه‌ای پیچیده یک بوم‌سازگان را بهتر نمایش می‌دهد."], ["زیست ۹۹: چرخه آب و کربن", "آب و کربن دائماً میان جو، آب‌ها، خاک و جانداران جابه‌جا می‌شوند و فرایندهایی مانند تبخیر و فتوسنتز در این چرخه‌ها نقش دارند."], ["زیست ۱۰۰: تنوع زیستی و حفاظت", "تنوع زیستی شامل تنوع ژن‌ها، گونه‌ها و بوم‌سازگان‌هاست و حفاظت از زیستگاه‌ها به پایداری این تنوع کمک می‌کند."]];

// 100 grammar lessons with fuller Persian explanations
const GRAMMAR_100 = [["01. Present Simple", "I study every day.", "برای عادت، حقیقت و برنامه ثابت. ساختار مثبت: subject + base verb؛ در he/she/it معمولاً s/es اضافه می‌شود. سوال و منفی با do/does ساخته می‌شود. مثال: She works here. / Does she work here? / She doesn’t work here."], ["02. Present Continuous", "I am studying now.", "برای کاری که اکنون در جریان است یا موقعیتی موقت. ساختار: am/is/are + verb-ing. مثال: They are playing now. در بسیاری از موارد با now, right now و at the moment می‌آید."], ["03. Past Simple", "I visited my friend yesterday.", "برای رویداد تمام‌شده در گذشته. افعال باقاعده معمولاً ed می‌گیرند و افعال بی‌قاعده شکل ویژه دارند. سوال و منفی با did + base verb است."], ["04. Past Continuous", "I was reading at eight.", "برای کاری که در زمان مشخصی در گذشته در جریان بوده است. ساختار: was/were + ing. اغلب برای زمینه‌سازی کنار Past Simple می‌آید: I was sleeping when he called."], ["05. Present Perfect", "I have finished my homework.", "برای تجربه، نتیجه مرتبط با حال یا رویدادی در زمانی نامشخص. ساختار have/has + past participle. با yesterday معمولاً استفاده نمی‌شود چون زمان گذشته مشخص است."], ["06. Present Perfect Continuous", "I have been studying for two hours.", "برای فعالیتی که از گذشته شروع شده و تا حال ادامه داشته یا اثرش مهم است. ساختار have/has been + ing. for مدت و since نقطه شروع را نشان می‌دهد."], ["07. Past Perfect", "I had left before he arrived.", "برای نشان دادن کاری که قبل از کار دیگری در گذشته رخ داده است. ساختار had + past participle. مثال: She had eaten before we came."], ["08. Past Perfect Continuous", "I had been waiting for an hour.", "مدت ادامه یک فعالیت تا یک نقطه در گذشته را نشان می‌دهد. ساختار had been + ing."], ["09. Future with will", "I will call you later.", "برای تصمیم لحظه‌ای، وعده، پیشنهاد و بعضی پیش‌بینی‌ها. ساختار will + base verb. منفی: won’t. سوال: Will you...?"], ["10. Be going to", "I am going to study tonight.", "برای قصد یا برنامه قبلی و پیش‌بینی بر اساس شواهد. ساختار be + going to + base verb."], ["11. Future Continuous", "I will be working at eight.", "برای کاری که در زمان مشخصی در آینده در جریان خواهد بود. will be + ing."], ["12. Future Perfect", "I will have finished by eight.", "برای کاری که تا یک زمان مشخص در آینده تمام خواهد شد. will have + past participle."], ["13. Can", "Can you help me?", "برای توانایی، اجازه و درخواست. بعد از can فعل بدون to می‌آید: can swim, can help."], ["14. Could", "Could you open the door?", "برای توانایی گذشته و درخواست مؤدبانه. could + base verb."], ["15. May / Might", "It might rain.", "برای احتمال. might معمولاً احتمال ضعیف‌تر را می‌رساند، ولی در گفتار مرز آن‌ها قطعی نیست. بعد از هر دو فعل ساده می‌آید."], ["16. Must / Have to", "You must be careful. / I have to leave.", "هر دو می‌توانند ضرورت را برسانند. must بیشتر از الزام گوینده می‌آید؛ have to اغلب به شرایط یا قانون مربوط است. mustn’t یعنی ممنوع است و don’t have to یعنی لازم نیست."], ["17. Should", "You should rest.", "برای توصیه، انتظار و پیشنهاد. ساختار should + base verb."], ["18. First Conditional", "If it rains, I will stay home.", "برای شرط واقعی یا محتمل در آینده: if + present, will + base. در بخش if معمولاً will نمی‌آید."], ["19. Second Conditional", "If I had time, I would travel.", "برای موقعیت فرضی یا غیرواقعی اکنون/آینده: if + past, would + base."], ["20. Third Conditional", "If I had studied, I would have passed.", "برای حالت فرضی درباره گذشته و نتیجه‌ای که رخ نداده: if + past perfect, would have + p.p."], ["21. Zero Conditional", "If you heat ice, it melts.", "برای حقیقت عمومی یا نتیجه‌ای که معمولاً رخ می‌دهد: if + present, present."], ["22. Passive Voice", "The book was written by Ali.", "وقتی تمرکز روی عمل یا نتیجه است. ساختار کلی: be + past participle. زمان فعل be تغییر می‌کند: is made, was made, has been made."], ["23. Reported Speech", "He said that he was tired.", "برای گزارش گفته دیگران. بسته به زمان گزارش، زمان و ضمیر ممکن است تغییر کند: “I am tired” → He said he was tired."], ["24. Comparative", "This car is faster than that one.", "برای مقایسه دو مورد. صفت کوتاه معمولاً -er و صفت بلند more می‌گیرد: faster, more useful."], ["25. Superlative", "This is the fastest car.", "برای بیان بالاترین درجه در یک گروه: the + -est یا the most + adjective."], ["26. Articles a/an", "I saw a cat.", "برای یک اسم مفرد قابل‌شمارشِ نامشخص. an قبل از صدای واکه می‌آید: an apple, an hour."], ["27. Article the", "The cat is on the table.", "برای چیزی مشخص، شناخته‌شده یا یکتا در بافت. کاربرد the به صدا یا حرف اول وابسته نیست، بلکه به مشخص بودن اسم مربوط است."], ["28. Some / Any", "I have some water. Do you have any?", "some در جملات مثبت رایج است و any در سوال و منفی؛ اما استثناهای کاربردی وجود دارد، مثلاً پیشنهاد مؤدبانه با some."], ["29. Much / Many", "much water / many books", "much برای اسم غیرقابل‌شمارش و many برای اسم قابل‌شمارش جمع است."], ["30. Few / Little", "few books / little time", "few برای اسم‌های قابل‌شمارش و little برای غیرقابل‌شمارش. a few و a little معمولاً معنی مثبت‌تری دارند: کمی/چندتا."], ["31. Gerund", "I enjoy reading.", "verb-ing وقتی نقش اسم دارد یا بعد از برخی افعال می‌آید. enjoy, avoid و finish معمولاً بعدشان gerund می‌آید."], ["32. Infinitive", "I want to learn.", "to + base verb. بعد از افعالی مانند want, need, decide و hope رایج است."], ["33. Prepositions of time", "at 5, on Monday, in July", "at برای زمان دقیق، on برای روز و تاریخ، in برای ماه، سال و بازه‌های طولانی‌تر."], ["34. Question words", "Who, what, where, when, why, how?", "who شخص، what چیز، where مکان، when زمان، why دلیل و how روش یا حالت را می‌پرسد."], ["35. Tag questions", "You are ready, aren’t you?", "سوال کوتاه برای تأیید. جمله مثبت معمولاً tag منفی می‌گیرد و برعکس."], ["36. Relative clauses", "The boy who won is my friend.", "برای توضیح اسم از who برای افراد و which/that برای اشیا و حیوانات استفاده می‌شود؛ بعضی کاربردها به ساختار رسمی یا غیررسمی وابسته‌اند."], ["37. Adverbs of frequency", "I usually study at night.", "always, usually, often, sometimes, rarely, never میزان تکرار را نشان می‌دهند. جای آن‌ها به نوع فعل بستگی دارد."], ["38. Phrasal verbs", "Please turn off the light.", "ترکیب فعل با قید یا حرف اضافه که معنای تازه می‌سازد. turn off یعنی خاموش کردن."], ["39. Countable / Uncountable", "two apples / some rice", "اسم‌های قابل‌شمارش جمع می‌شوند و با many می‌آیند؛ غیرقابل‌شمارش معمولاً با much و مقداردهنده‌هایی مثل some."], ["40. There is / There are", "There are three books.", "برای بیان وجود چیزی. مفرد: there is؛ جمع: there are."], ["41. Used to", "I used to play here.", "برای عادت یا وضعیت گذشته که دیگر معمولاً وجود ندارد. منفی و سوالی می‌تواند با did ساخته شود: Did you use to...?"], ["42. Be used to", "I am used to waking up early.", "یعنی به چیزی عادت داشتن. بعد از to در این ساختار اسم یا gerund می‌آید."], ["43. Get used to", "I am getting used to the new school.", "یعنی به‌تدریج عادت کردن. بعد از to اسم یا ing می‌آید."], ["44. Would for past habits", "Every summer, we would visit my uncle.", "برای بیان عادت‌های تکراری گذشته، نه معمولاً برای حالت‌های دائمی."], ["45. Present perfect with since", "I have lived here since 2022.", "since نقطه شروع را نشان می‌دهد و با زمان شروع می‌آید."], ["46. Present perfect with for", "I have lived here for four years.", "for مدت زمان را نشان می‌دهد."], ["47. Already / Yet / Just", "I have just arrived. Have you finished yet?", "already برای زودتر از انتظار، yet بیشتر در سوال و منفی و just برای اتفاق بسیار نزدیک به حال استفاده می‌شود."], ["48. Ever / Never", "Have you ever seen snow? I have never been there.", "ever بیشتر در سوال‌های تجربه و never برای بیان نبودن تجربه به کار می‌رود."], ["49. Since vs For", "since Monday / for two days", "since = از یک نقطه زمانی؛ for = به مدت یک بازه."], ["50. Still", "I still remember it.", "still ادامه وضعیت یا کاری را نشان می‌دهد و معمولاً قبل از فعل اصلی می‌آید."], ["51. Yet", "I haven’t finished yet.", "yet در بسیاری از سوال‌ها و جمله‌های منفی برای چیزی که تا این لحظه رخ نداده استفاده می‌شود."], ["52. So / Such", "It is so cold. It is such a cold day.", "so پیش از صفت یا قید و such پیش از عبارت اسمی می‌آید."], ["53. Too / Enough", "It is too hot to run. It is warm enough to walk.", "too یعنی بیش از حد و enough یعنی به اندازه کافی."], ["54. As ... as", "This book is as useful as that one.", "برای مقایسه برابری: as + adjective + as."], ["55. Not as ... as", "This one is not as expensive as that one.", "برای نشان دادن کمتر بودن نسبت به مورد دیگر."], ["56. Both / Either / Neither", "Both are good. Either is fine. Neither works.", "both هر دو، either یکی از دو گزینه، neither هیچ‌کدام از دو گزینه."], ["57. Either ... or", "You can either walk or take the bus.", "برای انتخاب بین دو گزینه."], ["58. Neither ... nor", "Neither Ali nor Reza came.", "برای منفی کردن دو گزینه با هم."], ["59. Both ... and", "Both English and Arabic are useful.", "برای افزودن و تأکید بر هر دو مورد."], ["60. Each / Every", "Each student has a book. Every student needs practice.", "هر دو برای اعضای یک مجموعه‌اند؛ each روی اعضا جداگانه تأکید بیشتری دارد."], ["61. Another / Other / Others", "I need another pen. Other students are here.", "another برای یک مورد دیگر، other برای اسم دیگر/دیگران و others وقتی اسم بعدی حذف شده است."], ["62. One / Ones", "I like the blue one.", "برای جلوگیری از تکرار اسم قابل‌شمارش از one/ones استفاده می‌شود."], ["63. Object pronouns", "Help me. I saw him.", "me, you, him, her, it, us, them بعد از فعل یا حرف اضافه به‌عنوان مفعول می‌آیند."], ["64. Possessive adjectives", "My book is here.", "my, your, his, her, its, our, their قبل از اسم می‌آیند."], ["65. Possessive pronouns", "This book is mine.", "mine, yours, his, hers, ours, theirs جای عبارت ملکی را می‌گیرند و بعدشان اسم نمی‌آید."], ["66. Reflexive pronouns", "I did it myself.", "myself, yourself, himself و... وقتی فاعل و مفعول یکی‌اند یا برای تأکید استفاده می‌شوند."], ["67. Imperatives", "Open the door, please.", "برای دستور، درخواست یا راهنمایی از شکل پایه فعل استفاده می‌شود. منفی: Don’t + verb."], ["68. Let’s", "Let’s start.", "برای پیشنهاد انجام کاری با هم. پاسخ می‌تواند Sounds good یا Sure باشد."], ["69. Would like", "I would like some water.", "برای درخواست یا بیان خواسته مؤدبانه. would like + noun یا to + verb."], ["70. Would you mind", "Would you mind opening the window?", "درخواست مؤدبانه؛ بعد از mind معمولاً gerund می‌آید."], ["71. Could you please", "Could you please repeat that?", "ساختار رایج برای درخواست مؤدبانه و طبیعی."], ["72. Shall", "Shall we go?", "برای پیشنهاد، مخصوصاً با I/we در سبک نسبتاً رسمی یا بریتانیایی."], ["73. Need to", "I need to study.", "برای ضرورت شخصی یا نیاز. بعد از need to فعل ساده می‌آید."], ["74. Don’t need to", "You don’t need to wait.", "یعنی لازم نیست؛ با mustn’t اشتباه نشود چون mustn’t یعنی ممنوع است."], ["75. Had better", "You had better leave now.", "توصیه نسبتاً قوی درباره بهترین کار در شرایط موجود. ساختار had better + base verb."], ["76. Why don’t we", "Why don’t we study together?", "برای پیشنهاد دوستانه. پاسخ مثبت می‌تواند Sure یا Good idea باشد."], ["77. How about", "How about going by bus?", "برای پیشنهاد. بعد از how about معمولاً اسم یا gerund می‌آید."], ["78. What about", "What about tomorrow?", "برای پیشنهاد یا پرسیدن نظر درباره یک گزینه."], ["79. Make / Let", "My parents made me study. Let me help.", "make در ساختار سببی بدون to می‌آید؛ let نیز به معنی اجازه دادن با base verb می‌آید."], ["80. Have something done", "I had my phone repaired.", "برای کاری که شخص دیگری برای ما انجام داده است: have + object + past participle."], ["81. Causative get", "I got my bike fixed.", "ساختار سببی با get + object + past participle، معمولاً با لحن محاوره‌ای‌تر."], ["82. Infinitive of purpose", "I went there to study.", "to + verb می‌تواند هدف انجام کار را نشان دهد."], ["83. Too ... to", "It is too heavy to lift.", "ساختار برای بیان اینکه شدت یک ویژگی اجازه انجام کار را نمی‌دهد."], ["84. Enough ... to", "He is strong enough to carry it.", "برای بیان کافی بودن یک ویژگی برای انجام کار."], ["85. Adjective + infinitive", "I am happy to help.", "بعضی صفت‌ها با to + verb می‌آیند تا احساس، نظر یا وضعیت را توضیح دهند."], ["86. Adjective + preposition", "I am interested in science.", "برخی صفت‌ها حرف اضافه مشخص دارند؛ interested in، good at، afraid of نمونه‌اند."], ["87. Verb + preposition", "Listen to me. Wait for us.", "برخی افعال حرف اضافه ثابت دارند و باید ترکیب آن‌ها را یکجا یاد گرفت."], ["88. Question with do", "Do you like music?", "در زمان حال ساده برای سوال با بیشتر افعال اصلی از do/does استفاده می‌شود."], ["89. Question with did", "Did you see him?", "در گذشته ساده، did زمان را حمل می‌کند و فعل اصلی به شکل پایه برمی‌گردد."], ["90. Negative with do", "I don’t know. She doesn’t know.", "برای منفی کردن حال ساده با فعل اصلی از do/does + not استفاده می‌شود."], ["91. Negative with be", "I am not ready. They aren’t here.", "فعل be بدون do منفی می‌شود: am not, isn’t, aren’t, wasn’t, weren’t."], ["92. Short answers", "Yes, I do. No, she isn’t.", "پاسخ کوتاه معمولاً با همان فعل کمکی یا be سؤال ساخته می‌شود."], ["93. Subject questions", "Who called you?", "وقتی خودِ فاعل ناشناخته است، معمولاً do/does/did لازم نیست: Who called?"], ["94. Object questions", "Who did you call?", "وقتی مفعول ناشناخته است، در بسیاری از موارد do/does/did لازم می‌شود."], ["95. Indirect questions", "Could you tell me where the station is?", "در سوال غیرمستقیم ترتیب جمله خبری می‌شود: where the station is، نه where is the station."], ["96. Linking words", "because, so, although, however", "برای پیوند ایده‌ها. because دلیل، so نتیجه، although تضاد و however تضاد بین دو جمله را نشان می‌دهد."], ["97. First vs Because", "I stayed home because it rained.", "because علت را معرفی می‌کند؛ first ترتیب زمانی را نشان می‌دهد و نباید با آن اشتباه شود."], ["98. Although / Even though", "Although it was cold, we went out.", "برای بیان تضاد. even though معمولاً تأکید بیشتری دارد."], ["99. Unless", "I won’t go unless you come.", "unless تقریباً به معنی if ... not است و شرط منفی را می‌رساند."], ["100. As soon as", "Call me as soon as you arrive.", "برای دو رویداد که یکی بلافاصله پس از دیگری رخ می‌دهد. در بند زمانی آینده معمولاً present به کار می‌رود."]];

function botReply(input){
  const t=input.trim().toLowerCase();
  const hit=CHAT_EXPANSION.find(([k])=>t.includes(k));
  if(hit) return Array.isArray(hit[1]) ? pick(hit[1]) : hit[1];
  if(t.includes('زیست') && (t.includes('چند')||t.includes('بخش'))) return 'زیست الان ۱۰۰ بخش آموزشی دارد؛ از سلول و ژنتیک تا بدن انسان، گیاهان، تکامل و بوم‌شناسی.';
  if(t.includes('گرامر') && (t.includes('چند')||t.includes('مبحث'))) return 'گرامر انگلیسی الان ۱۰۰ مبحث دارد و هرکدام مثال و توضیح فارسی دارند.';
  if(t.includes('فیزیک') && (t.includes('چند')||t.includes('مفهوم'))) return `فیزیک گسترده‌تر شده و کتابخانه مفاهیمش ${typeof PHYSICS_CONCEPTS!=='undefined'?PHYSICS_CONCEPTS.length:0} مورد دارد.`;
  return botReplyBase(input);
}

const PROPHET_STORIES={"آدم":"داستان آفرینش آدم، سکونت در بهشت و آغاز زندگی انسان در زمین در قرآن و روایت‌های اسلامی آمده است.","نوح":"داستان دعوت طولانی نوح، ساخت کشتی و نجات مؤمنان در قرآن با جزئیات مختلف روایت شده است.","ابراهیم":"روایت ابراهیم شامل مبارزه با بت‌پرستی، مهاجرت، آزمون‌های دشوار و پیوند با کعبه در منابع اسلامی است.","یوسف":"سوره یوسف داستان زندگی او را از جدایی از خانواده تا حضور در مصر، تعبیر خواب و دیدار دوباره با خانواده بیان می‌کند.","موسی":"داستان موسی شامل تولد در دوران فرعون، رشد در مصر، رویارویی با فرعون، خروج بنی‌اسرائیل و دریافت تورات در روایت اسلامی است.","عیسی":"قرآن تولد عیسی از مریم، دعوت او و معجزات منسوب به او را بیان می‌کند و درباره سرنوشت او دیدگاه اسلامی خاصی ارائه می‌دهد.","محمد":"سیره پیامبر اسلام شامل دوران مکه، بعثت، هجرت به مدینه، پیمان‌ها، حجةالوداع و رحلت در مدینه است."};
const RELIGION_STORIES=[["داستان یوسف","روایت قرآنی","از جدایی یوسف از خانواده و افتادن در چاه تا زندگی در مصر، تعبیر خواب و دیدار دوباره با پدر و برادران."],["داستان موسی و فرعون","روایت قرآنی","از تولد موسی و رشد او تا دعوت فرعون، خروج بنی‌اسرائیل و رخدادهای پس از آن در روایت قرآن."],["داستان ابراهیم و بت‌ها","روایت قرآنی","داستان دعوت ابراهیم به توحید و گفت‌وگوی او با قومش درباره پرستش بت‌ها در چند سوره قرآن آمده است."],["غدیر خم","رویداد و روایت تاریخی","در منابع اسلامی گزارش‌هایی از خطبه پیامبر در غدیر نقل شده و درباره معنا و دلالت آن میان مکاتب اسلامی بحث وجود دارد."],["کربلا و عاشورا","رویداد تاریخی و مذهبی","واقعه ۱۰ محرم ۶۱ هجری در کربلا و شهادت امام حسین و یارانش در حافظه و فرهنگ شیعه جایگاه محوری دارد."],["هجرت پیامبر","رویداد تاریخی","هجرت از مکه به مدینه در سال ۶۲۲ میلادی نقطه آغاز تقویم هجری قمری شد و مسیر تاریخ جامعه مسلمانان را تغییر داد."],["حدیث نیت","حدیث مشهور","مضمون مشهور این حدیث آن است که ارزش اعمال با نیت انسان ارتباط دارد؛ این حدیث در منابع حدیثی مهم نقل شده است."],["حدیث دانش","میراث روایی","در منابع اسلامی سخنان فراوانی درباره ارزش دانش و یادگیری نقل شده است؛ برای نسبت دادن هر متن باید منبع و سند آن بررسی شود."]];
function religionRecord(name){return RELIGION_DATA.find(x=>x[0]===name)||[name,"موضوع دینی","اطلاعات دقیق در داده پایه ثبت نشده است","برای این موضوع باید به منبع معتبر دینی مراجعه شود","منبع مشخص نشده"];}
function religionDetailed(root,name){
  const base=religionRecord(name),extra=RELIGION_EXTRA[name],story=PROPHET_STORIES[name];
  const facts=[["جایگاه",extra?.kind||base[1]],["تولد / آغاز زندگی",extra?.birth||base[2]||"در داده پایه مشخص نشده"],["وفات / پایان زندگی",extra?.death||"در داده پایه مشخص نشده"],["شهادت / نوع وفات",extra?.martyr||"برای این شخصیت در داده پایه نوع وفات ثبت نشده است"],["داستان و زندگی",extra?.story||story||base[3]],["حدیث / روایت",extra?.hadith||base[4]],["منبع یا چارچوب",extra?.source||base[4]]];
  const lines=makeReligionLines([name,base[1],base[3],base[4]]);
  lines.splice(2,0,`پاراگراف ویژه — تولد و وفات: ${facts[1][1]}؛ ${facts[2][1]}. ${facts[3][1]}`);
  lines.splice(3,0,`پاراگراف ویژه — داستان: ${facts[4][1]}`);
  lines.splice(4,0,`پاراگراف ویژه — حدیث و روایت: ${facts[5][1]}`);
  detailPanel(root,name,facts,{image:religionImg("قرآن"),lines});
}

function map2D(c){

    const x=(c.lng+180)*1.5,y=(90-c.lat)*1.5,r=Math.max(5,Math.min(60,Math.sqrt(c.area||1)/111/2*1.5));
    return `<div class="m2d-box"><svg class="m2d" viewBox="0 0 540 270">${bg}<rect x="${x-r}" y="${y-r*.75}" width="${2*r}" height="${1.5*r}" rx="6" fill="#e6b34d33" stroke="#c1517d" stroke-width="1.6" stroke-dasharray="5 3"/><circle cx="${x}" cy="${y}" r="5" fill="#c1517d"/><circle cx="${x}" cy="${y}" r="14" fill="none" stroke="#c1517d"><animate attributeName="r" values="6;22" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle><text x="${Math.min(480,Math.max(60,x))}" y="${Math.max(24,y-r-10)}" text-anchor="middle" font-size="18" font-weight="bold" fill="#223">${c.flag} ${countryFa(c)}</text></svg><div class="m2d-note">جایگاه کشور روی نقشهٔ جهان (کادر تقریبی بر پایهٔ مساحت). طرح دقیق مرزی فقط برای ایران، آذربایجان، ترکیه، عراق و افغانستان آماده است.</div></div>`;
  }
  const lons=o.p.map(a=>a[0]),lats=o.p.map(a=>a[1]),mnx=Math.min(...lons),mxx=Math.max(...lons),mnl=Math.min(...lats),mxl=Math.max(...lats);
  const k=Math.cos((mnl+mxl)/2*Math.PI/180),w=(mxx-mnx)*k,h=mxl-mnl,s=Math.min(520/w,300/h),ox=(600-w*s)/2,oy=(360-h*s)/2;

  root.innerHTML=`<div class="panel"><div class="panel-title">📝 ابزار مطالعه</div><div class="panel-sub">تایمر پومودورو (۲۵ دقیقه تمرکز، ۵ دقیقه استراحت) و دفترچهٔ یادداشت</div>
  <svg class="tm-ring" width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="76" fill="none" stroke="var(--panel2)" stroke-width="12"/><circle id="ring" cx="90" cy="90" r="76" fill="none" stroke="var(--amber)" stroke-width="12" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="0" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1s linear"/><text id="tt" x="90" y="92" text-anchor="middle" fill="currentColor" font-size="34" font-weight="bold">۲۵:۰۰</text><text id="tl" x="90" y="122" text-anchor="middle" fill="currentColor" font-size="14">🎯 تمرکز</text></svg>
  <div style="text-align:center"><button class="tm-b" id="ts">▶ شروع</button><button class="tm-b" id="tr">↺ از اول</button><button class="tm-b" id="tm">☕ استراحت</button></div>
  <div class="panel-title" style="margin-top:18px">🗒️ دفترچه</div><textarea class="st-note" id="nt" placeholder="نکته‌های مهم درس را اینجا بنویس؛ خودکار ذخیره می‌شود..."></textarea></div>`;
  const nt=root.querySelector('#nt');try{nt.value=localStorage.getItem('nb_note')||'';}catch(e){}nt.oninput=()=>{try{localStorage.setItem('nb_note',nt.value);}catch(e){}};
  let tot=1500,left=tot,run=null,brk=false;const tt=root.querySelector('#tt'),ring=root.querySelector('#ring'),tl=root.querySelector('#tl'),sb=root.querySelector('#ts');
  const draw=()=>{tt.textContent=(String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);ring.style.strokeDashoffset=477.5*(1-left/tot);};
  const stop=()=>{clearInterval(run);run=null;sb.textContent='▶ شروع';};
  const set=b=>{stop();brk=b;tot=b?300:1500;left=tot;tl.textContent=b?'☕ استراحت':'🎯 تمرکز';ring.style.stroke=b?'var(--teal)':'var(--amber)';draw();};
  sb.onclick=()=>{if(run){stop();return;}sb.textContent='⏸ توقف';run=setInterval(()=>{if(!document.body.contains(tt)){clearInterval(run);return;}left--;draw();if(left<=0){stop();if(!brk){addXP(20);fly(tt,['🎉','⭐','💪','🔥']);}set(!brk);}},1000);};
  root.querySelector('#tr').onclick=()=>set(brk);root.querySelector('#tm').onclick=()=>set(true);draw();
}

/* ---- projectile lab ---- */
function lab(root){
  root.innerHTML=`<div class="panel"><div class="panel-title">🚀 آزمایشگاه پرتابه</div><div class="panel-sub">سرعت و زاویه را تنظیم کن و گلوله را در سیاره‌های مختلف شلیک کن</div><canvas class="lab-cv" id="cv" width="640" height="320"></canvas>
  <div class="lab-ctl"><label>سرعت اولیه: <b id="lv"></b> متر بر ثانیه</label><input type="range" id="v" min="5" max="60" value="30"><label>زاویه: <b id="la"></b> درجه</label><input type="range" id="a" min="5" max="85" value="45"><label>گرانش</label><select id="g"><option value="9.8">🌍 زمین (۹٫۸)</option><option value="1.62">🌙 ماه (۱٫۶۲)</option><option value="3.71">🔴 مریخ (۳٫۷۱)</option><option value="24.8">🟠 مشتری (۲۴٫۸)</option></select></div>
  <button class="nb-quizbtn" id="fire">🔥 شلیک!</button><div class="nb-tip" id="res">نتیجه بعد از شلیک نمایش داده می‌شود.</div></div>`;
  const cv=root.querySelector('#cv'),c=cv.getContext('2d'),V=root.querySelector('#v'),A=root.querySelector('#a'),G=root.querySelector('#g');let raf=null;
  const upd=()=>{root.querySelector('#lv').textContent=fd(V.value);root.querySelector('#la').textContent=fd(A.value);};V.oninput=A.oninput=upd;upd();
  const bg=()=>{c.clearRect(0,0,640,320);c.fillStyle='#16324f';c.fillRect(0,0,640,320);c.fillStyle='#fff6';for(let i=0;i<30;i++)c.fillRect((i*97)%640,(i*53)%200,2,2);c.fillStyle='#2f7a4a';c.fillRect(0,290,640,30);};bg();
  root.querySelector('#fire').onclick=()=>{cancelAnimationFrame(raf);const v=+V.value,a=A.value*Math.PI/180,g=+G.value,vx=v*Math.cos(a),vy=v*Math.sin(a),T=2*vy/g,R=vx*T,H=vy*vy/(2*g),sc=Math.min(580/R,230/H,12),t0=performance.now(),speed=Math.max(1,T/3);
    root.querySelector('#res').innerHTML=`📏 برد: <b>${fd(R.toFixed(1))}</b> متر · ⛰️ بیشینه ارتفاع: <b>${fd(H.toFixed(1))}</b> متر · ⏱️ زمان پرواز: <b>${fd(T.toFixed(2))}</b> ثانیه`;
    const tr=[];const step=now=>{const t=Math.min(T,(now-t0)/1000*speed);const x=30+vx*t*sc,y=290-(vy*t-g*t*t/2)*sc;tr.push([x,y]);bg();c.fillStyle='#ffd16688';tr.forEach(p=>{c.beginPath();c.arc(p[0],p[1],2.5,0,7);c.fill();});c.font='26px serif';c.fillText('⚽',x-13,y+9);if(t<T)raf=requestAnimationFrame(step);else{addXP(3);c.font='28px serif';c.fillText('💥',x-14,296);}};raf=requestAnimationFrame(step);};
}

function ptable(root){

    b.onclick=()=>{const gas=[1,2,7,8,9,10,17,18,36].includes(e.z),st=e.z===35?'مایع 💧':gas?'گاز 💨':'جامد 🧱',grp=c<=2?c:c>=13?c:c,i=root.querySelector('#pi');i.style.animation='none';void i.offsetWidth;i.style.animation='';

const PLANETS=[['زمین','🌍',9.8,1],['ماه','🌙',1.62,0],['مریخ','🔴',3.71,0.3],['زهره','🟠',8.87,3.2],['مشتری (فرضی)','🟤',24.8,1.6]];
const BALLS=[['فوتبال','⚽',0.43,0.33,0.11],['تنیس','🎾',0.058,0.5,0.033],['پینگ‌پنگ','🏓',0.0027,0.4,0.02],['گلولهٔ آهنی','⚫',7.2,0.3,0.04],['پَر','🪶',0.00018,1.2,0.05]];
function labPro(root){
  let planet=0,ball=0,raf=null;
  root.innerHTML=`<div class="panel"><div class="panel-title">🪐 آزمایشگاه فیزیک پیشرفته — پرتابه با سیاره و هوا</div><div class="panel-sub">سیاره، نوع توپ، سرعت و زاویه را عوض کن؛ مقاومت هوا و جاذبهٔ هر سیاره روی مسیر اثر می‌گذارد. زمین (دشت) این بار طولانی‌تر است.</div>
  <div class="row" id="lpPl" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"></div>
  <div class="row" id="lpBl" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
  <canvas class="lab-cv" id="cv" width="980" height="320"></canvas>
  <div class="lab-ctl"><label>سرعت اولیه: <b id="lv"></b> متر بر ثانیه</label><input type="range" id="v" min="5" max="70" value="32"><label>زاویه: <b id="la"></b> درجه</label><input type="range" id="a" min="5" max="85" value="42"></div>
  <button class="nb-quizbtn" id="fire">🔥 شلیک!</button><div class="nb-tip" id="res">نتیجه بعد از شلیک نمایش داده می‌شود.</div></div>`;
  const pl=root.querySelector('#lpPl'),bl=root.querySelector('#lpBl');
  pl.innerHTML=PLANETS.map((p,i)=>`<button class="pz-th ${i===planet?'on':''}" data-i="${i}">${p[1]} ${p[0]}</button>`).join('');
  bl.innerHTML=BALLS.map((b,i)=>`<button class="pz-th ${i===ball?'on':''}" data-i="${i}">${b[1]} ${b[0]}</button>`).join('');
  pl.querySelectorAll('button').forEach(b=>b.onclick=()=>{planet=+b.dataset.i;pl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  bl.querySelectorAll('button').forEach(b=>b.onclick=()=>{ball=+b.dataset.i;bl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  const cv=root.querySelector('#cv'),c=cv.getContext('2d'),V=root.querySelector('#v'),A=root.querySelector('#a');
  const upd=()=>{root.querySelector('#lv').textContent=fa(V.value);root.querySelector('#la').textContent=fa(A.value);};V.oninput=A.oninput=upd;upd();
  const W=980,H=320,groundY=H-26;
  function bg(maxX){c.clearRect(0,0,W,H);
    let g=c.createLinearGradient(0,0,0,groundY);g.addColorStop(0,'#13335a');g.addColorStop(1,'#0c2038');c.fillStyle=g;c.fillRect(0,0,W,groundY);
    c.fillStyle='#fff5';for(let i=0;i<46;i++)c.fillRect((i*83)%W,(i*37)%(groundY-10),2,2);
    c.fillStyle='#2f7a4a';c.fillRect(0,groundY,W,H-groundY);
    c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.font='11px Vazirmatn,Tahoma,sans-serif';c.fillStyle='rgba(255,255,255,.55)';c.textAlign='center';
    const step=maxX>300?50:maxX>120?20:10;
    for(let d=0;d<=maxX+step;d+=step){const x=30+d*((W-60)/Math.max(maxX,step));if(x>W-5)break;c.beginPath();c.moveTo(x,groundY);c.lineTo(x,groundY+6);c.stroke();c.fillText(fa(d),x,groundY+18);}
  }
  bg(80);
  root.querySelector('#fire').onclick=()=>{
    cancelAnimationFrame(raf);
    const v=+V.value,ang=A.value*Math.PI/180,g=PLANETS[planet][2],airF=PLANETS[planet][3];
    const [, , mass,cd,rad]=BALLS[ball];
    const noAirR=(v*v*Math.sin(2*ang))/g;
    // numerical integration with simple quadratic air drag (airF = relative air density of the planet/moon)
    const area=Math.PI*rad*rad;
    const k=airF>0?(0.5*1.2*airF*cd*area/mass):0;
    let x=0,y=0,vx=v*Math.cos(ang),vy=v*Math.sin(ang),t=0,dt=0.016,maxH=0,path=[[x,y]];
    for(let steps=0;steps<4000;steps++){
      vy-=g*dt;
      const sp=Math.hypot(vx,vy)||1e-6,damp=1/(1+k*sp*dt);
      vx*=damp;vy*=damp;
      x+=vx*dt;y+=vy*dt;t+=dt;
      if(y>maxH)maxH=y;
      path.push([x,y]);
      if(y<0&&t>0.05)break;
    }
    const R=x,T=t;
    const maxX=Math.max(R,noAirR,20);
    root.querySelector('#res').innerHTML=`📏 برد واقعی (با اثر هوا): <b>${fa(R.toFixed(1))}</b> متر · ⛰️ بیشینه ارتفاع: <b>${fa(maxH.toFixed(1))}</b> متر · ⏱️ زمان پرواز: <b>${fa(T.toFixed(2))}</b> ثانیه<br><small style="opacity:.75">بدون مقاومت هوا، برد تقریبی: ${fa(noAirR.toFixed(1))} متر — تفاوت نشان‌دهندهٔ اثر هوا و شکل/جرم توپ است. روی سیاره‌ای بدون هوا (مثل ماه)، نوع توپ فرقی در مسیر نمی‌کند؛ این همان آزمایش مشهور «پَر و چکش» گالیله است.</small>`;
    const sc=(W-60)/Math.max(maxX,10);
    bg(maxX);
    const t0=performance.now(),speed=Math.max(1,T/3.2),emoji=BALLS[ball][1];
    const trail=[];
    const step=now=>{const tt=Math.min(T,(now-t0)/1000*speed);const idx=Math.min(path.length-1,Math.round(tt/dt));const p=path[idx]||path[path.length-1];
      const px=30+p[0]*sc,py=groundY-p[1]*sc;trail.push([px,py]);bg(maxX);
      c.fillStyle='#ffd16688';trail.forEach(q=>{c.beginPath();c.arc(q[0],q[1],2.2,0,7);c.fill();});
      c.font='24px serif';c.textAlign='center';c.fillText(emoji,px,py+8);
      if(tt<T)raf=requestAnimationFrame(step);else{if(typeof addXP==='function')addXP(3);c.font='26px serif';c.fillText('💥',px,groundY-4);}};
    raf=requestAnimationFrame(step);
  };
}

/* ================= BIOLOGY: 3D organ models ================= */
function organMesh(mod,scl){
  const A=14,B=20,V=[],F=[];
  for(let i=0;i<=A;i++){const th=i/A*Math.PI;
    for(let j=0;j<B;j++){const ph=j/B*2*Math.PI,r=mod(th,ph);
      V.push([r*Math.sin(th)*Math.cos(ph)*scl[0],r*Math.cos(th)*scl[1],r*Math.sin(th)*Math.sin(ph)*scl[2]]);}}
  for(let i=0;i<A;i++)for(let j=0;j<B;j++){const a0=i*B+j,a1=i*B+(j+1)%B,b0=(i+1)*B+j,b1=(i+1)*B+(j+1)%B;F.push([a0,a1,b1,b0]);}
  return {V,F};
}
function mergeMeshes(parts){const V=[],F=[];parts.forEach(({V:v,F:f,off=[0,0,0],col})=>{const base=V.length;v.forEach(p=>V.push([p[0]+off[0],p[1]+off[1],p[2]+off[2]]));f.forEach(fa2=>F.push({idx:fa2.map(k=>k+base),col}));});
  let m=0;V.forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]));});const s=1.5/(m||1);
  return {V:V.map(p=>[p[0]*s,p[1]*s,p[2]*s]),F};}

function organScreen(root){
  let key='heart',yaw=.6,pit=.4,drag=null;
  root.innerHTML=`<div class="panel"><div class="panel-title">🫀 ماکت سه‌بعدی اندام‌های بدن</div><div class="panel-sub">یک عضو را انتخاب کن؛ ماکت را با کشیدن می‌توان چرخاند</div>

  <canvas id="orC" width="640" height="360" style="width:100%;border-radius:16px;background:radial-gradient(circle at 50% 40%,#1d3350,#0a1420);touch-action:none;cursor:grab"></canvas>
  <div id="orD" class="nb-tip" style="margin-top:12px"></div></div>`;
  const tabs=root.querySelector('#orT'),cv=root.querySelector('#orC'),c=cv.getContext('2d'),info=root.querySelector('#orD');
  let M=null;
  function renderTabs(){tabs.innerHTML=Object.entries(ORGANS).map(([k,o])=>`<button class="pz-th ${k===key?'on':''}" data-k="${k}">${o.emo} ${o.n}</button>`).join('');
    tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{key=b.dataset.k;renderTabs();setup();});}
  function setup(){const o=ORGANS[key];M=o.build();info.innerHTML=`<b style="font-size:1.1em">${o.emo} ${o.n}</b><p style="margin-top:6px;line-height:2.1">${o.desc}</p>`;}
  function draw(){if(!document.body.contains(cv))return;c.clearRect(0,0,640,360);
    if(M){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pit),sp=Math.sin(pit);
      const P=M.V.map(p=>{let x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1]*cp-z*sp;z=p[1]*sp+z*cp;const f=1/(1+z*.12);return [320+x*f*130,190-y*f*130,z];});
      const fs=M.F.map(fc=>{const idx=fc.idx,z=idx.reduce((s,i)=>s+P[i][2],0)/idx.length;const a=P[idx[0]],b=P[idx[1]],d=P[idx[2]],nz=(b[0]-a[0])*(d[1]-a[1])-(b[1]-a[1])*(d[0]-a[0]);return {idx,z,l:Math.abs(nz),col:fc.col};}).sort((p,q)=>q.z-p.z);
      const mx=Math.max(...fs.map(o=>o.l))||1;
      fs.forEach(o=>{c.beginPath();o.idx.forEach((i,k)=>k?c.lineTo(P[i][0],P[i][1]):c.moveTo(P[i][0],P[i][1]));c.closePath();
        c.fillStyle=o.col;c.globalAlpha=.55+.45*Math.sqrt(o.l/mx);c.fill();c.globalAlpha=1;c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;c.stroke();});}
    if(!drag)yaw+=.006;requestAnimationFrame(draw);}
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yw:yaw,pt:pit};cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(drag){yaw=drag.yw+(e.clientX-drag.x)*.01;pit=Math.max(-1.4,Math.min(1.4,drag.pt+(e.clientY-drag.y)*.01));}};
  cv.onpointerup=()=>drag=null;
  renderTabs();setup();draw();
}

function pendMulti(root){
  root.innerHTML=`<div class="panel"><div class="panel-title">⏱️ آزمایشگاه آونگ‌ها</div>
  <div class="panel-sub">چند آونگ با طول متفاوت هم‌زمان — دورهٔ تناوب را مقایسه کن</div>
  <canvas id="pc" width="640" height="360" style="width:100%;border-radius:16px;background:linear-gradient(#0a1a2e,#061018)"></canvas>

    <option value="9.8">🌍 زمین (۹٫۸)</option><option value="1.62">🌙 ماه (۱٫۶۲)</option><option value="3.71">🔴 مریخ (۳٫۷۱)</option>
  </select></label>
  <div class="nb-tip" id="pr"></div>
  <button class="nb-quizbtn" id="resetP">🔄 رها کردن دوباره</button></div>`;
  const cv=root.querySelector('#pc'),c=cv.getContext('2d'),G=root.querySelector('#G');
  const pens=[{L:0.8,th:0.5,w:0,col:'#e6b34d',x:140},{L:1.4,th:0.55,w:0,col:'#49b3a6',x:320},{L:2.0,th:0.6,w:0,col:'#5f97c9',x:500}];
  let last=performance.now();
  const reset=()=>{pens.forEach((p,i)=>{p.th=0.45+i*0.08;p.w=0;});
    const g=+G.value;
    root.querySelector('#pr').innerHTML=pens.map((p,i)=>`آونگ ${['کوتاه','متوسط','بلند'][i]}: L=${fa(p.L)} m → T≈ <b>${fa(2*Math.PI*Math.sqrt(p.L/g))}</b> s`).join('<br>');
  };
  G.onchange=reset;root.querySelector('#resetP').onclick=reset;reset();
  (function loop(now){
    if(!document.body.contains(cv))return;
    const dt=Math.min(.03,(now-last)/1000);last=now;const g=+G.value;
    c.clearRect(0,0,640,360);
    c.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<40;i++)c.fillRect((i*47)%640,(i*31)%360,2,2);

    pens.forEach(p=>{
      p.w+=-(g/p.L)*Math.sin(p.th)*dt;p.th+=p.w*dt;p.w*=.9992;
      const s=95*p.L+30,bx=p.x+Math.sin(p.th)*s,by=40+Math.cos(p.th)*s;
      c.strokeStyle='#9ab';c.lineWidth=2.5;c.beginPath();c.moveTo(p.x,40);c.lineTo(bx,by);c.stroke();
      c.fillStyle=p.col;c.beginPath();c.arc(bx,by,14+p.L*2,0,7);c.fill();
      c.fillStyle='#fff';c.fillRect(p.x-20,36,40,5);
    });
    requestAnimationFrame(loop);
  })(performance.now());
}

/* ---------- biology: better organ meshes + more sections ---------- */
function organMeshHQ(mod,scl,detail=18){
  const A=detail,B=Math.max(16,detail+2),V=[],F=[];
  for(let i=0;i<=A;i++){const th=i/A*Math.PI;
    for(let j=0;j<B;j++){const ph=j/B*2*Math.PI,r=mod(th,ph);
      V.push([r*Math.sin(th)*Math.cos(ph)*scl[0],r*Math.cos(th)*scl[1],r*Math.sin(th)*Math.sin(ph)*scl[2]]);}}
  for(let i=0;i<A;i++)for(let j=0;j<B;j++){const a0=i*B+j,a1=i*B+(j+1)%B,b0=(i+1)*B+j,b1=(i+1)*B+(j+1)%B;F.push([a0,a1,b1,b0]);}
  return {V,F};
}
function mergeHQ(parts){const V=[],F=[];parts.forEach(({V:v,F:f,off=[0,0,0],col})=>{const base=V.length;v.forEach(p=>V.push([p[0]+off[0],p[1]+off[1],p[2]+off[2]]));f.forEach(fa2=>F.push({idx:fa2.map(k=>k+base),col}));});
  let m=0;V.forEach(p=>{m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2]));});const s=1.55/(m||1);
  return {V:V.map(p=>[p[0]*s,p[1]*s,p[2]*s]),F};}

function pendCollide(root){
  root.innerHTML=`<div class="panel"><div class="panel-title">⏱️ آونگ‌های برخوردکننده</div>
  <div class="panel-sub">سه آونگ روی یک میله — وقتی به هم می‌رسند تکانه رد و بدل می‌کنند (مثل collission آونگ نیوتن ساده)</div>
  <canvas id="pc" width="680" height="380" style="width:100%;border-radius:16px;background:linear-gradient(#0a1525,#050a12)"></canvas>

  <select id="G" style="width:100%;margin:8px 0;padding:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit">
    <option value="9.8">🌍 زمین</option><option value="1.62">🌙 ماه</option><option value="3.71">🔴 مریخ</option>
  </select></label>
  <div class="nb-tip" id="pr"></div>
  <button class="nb-quizbtn" id="kick">👊 هل دادن آونگ چپ</button>
  <button class="nb-quizbtn" id="resetP">🔄 بازنشانی</button></div>`;
  const cv=root.querySelector('#pc'),c=cv.getContext('2d'),G=root.querySelector('#G');
  const pivotY=50, spacing=90, baseX=340;
  // equal length for nice Newton's cradle-ish behavior, slight length variety
  const pens=[
    {L:1.35,th:-0.55,w:0,col:'#e6b34d',m:1.2},
    {L:1.35,th:0,w:0,col:'#49b3a6',m:1.0},
    {L:1.35,th:0.15,w:0,col:'#5f97c9',m:1.0}
  ];
  let last=performance.now();
  const pos=p=>{
    const s=110*p.L+40;
    const i=pens.indexOf(p);
    const px=baseX+(i-1)*spacing;
    return {px, py:pivotY, bx:px+Math.sin(p.th)*s, by:pivotY+Math.cos(p.th)*s, r:16+p.m*2, s};
  };
  const reset=()=>{pens[0].th=-0.7;pens[0].w=0;pens[1].th=0;pens[1].w=0;pens[2].th=0.05;pens[2].w=0;
    root.querySelector('#pr').innerHTML=`T ≈ <b>${fa(2*Math.PI*Math.sqrt(pens[0].L/+G.value))}</b> s — آونگ‌ها با برخورد کشسان تکانه می‌دهند`;};
  G.onchange=reset;root.querySelector('#resetP').onclick=reset;
  root.querySelector('#kick').onclick=()=>{pens[0].w-=2.2;};

  (function loop(now){
    if(!document.body.contains(cv))return;
    const dt=Math.min(0.02,(now-last)/1000);last=now;const g=+G.value;
    // integrate
    pens.forEach(p=>{
      p.w += -(g/p.L)*Math.sin(p.th)*dt;
      p.th += p.w*dt;
      p.w *= 0.9994; // light damping
    });
    // collisions between adjacent bobs (elastic, 1D along arc approx using x velocity)
    for(let iter=0;iter<3;iter++){
      for(let i=0;i<pens.length-1;i++){
        const a=pens[i],b=pens[i+1],pa=pos(a),pb=pos(b);
        const dx=pb.bx-pa.bx, dy=pb.by-pa.by, dist=Math.hypot(dx,dy), minD=pa.r+pb.r;
        if(dist<minD && dist>0.001){
          // separate
          const overlap=minD-dist, nx=dx/dist, ny=dy/dist;
          const inv=1/(a.m+b.m);
          pa.bx-=nx*overlap*b.m*inv; pb.bx+=nx*overlap*a.m*inv;
          // map back roughly to angle via horizontal offset from pivot
          const fix=(p,bx,by)=>{
            const i2=pens.indexOf(p);const px=baseX+(i2-1)*spacing;
            p.th=Math.atan2(bx-px, by-pivotY); // careful: cos for y down
            // atan2(x,y) when y is down-positive from pivot
            p.th=Math.atan2(bx-px, Math.max(1,by-pivotY));
          };
          // velocity exchange along normal (elastic)
          const va=a.w*a.L, vb=b.w*b.L; // arc speed approx
          const vaN=va, vbN=vb; // simplify along shared direction
          const ma=a.m,mb=b.m;
          const va2=((ma-mb)*vaN+2*mb*vbN)/(ma+mb);
          const vb2=((mb-ma)*vbN+2*ma*vaN)/(ma+mb);
          a.w=va2/a.L; b.w=vb2/b.L;
          // positional correction via angle
          const angA=Math.asin(Math.max(-1,Math.min(1,(pa.bx-nx*overlap*0.5 - (baseX+(i-1)*spacing))/pa.s)));
          const angB=Math.asin(Math.max(-1,Math.min(1,(pb.bx+nx*overlap*0.5 - (baseX+i*spacing))/pb.s)));
          if(isFinite(angA))a.th=angA; if(isFinite(angB))b.th=angB;
        }
      }
    }
    // draw
    c.clearRect(0,0,680,380);
    c.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<50;i++)c.fillRect((i*53)%680,(i*37)%380,2,2);
    c.strokeStyle='#6a7a8a';c.lineWidth=6;c.beginPath();c.moveTo(baseX-spacing-30,pivotY);c.lineTo(baseX+spacing+30,pivotY);c.stroke();
    c.fillStyle='#8899aa';c.fillRect(baseX-spacing-40,pivotY-8,spacing*2+80,12);
    pens.forEach((p,i)=>{
      const q=pos(p);
      c.strokeStyle='#cde';c.lineWidth=2.5;c.beginPath();c.moveTo(q.px,q.py);c.lineTo(q.bx,q.by);c.stroke();

    });

  })(performance.now());

function organMeshHQ2(mod,scl,detail){
  detail=detail||28;const A=detail,B=detail+4,V=[],F=[];
  for(let i=0;i<=A;i++){const th=i/A*Math.PI;for(let j=0;j<B;j++){const ph=j/B*2*Math.PI,r=mod(th,ph);
    V.push([r*Math.sin(th)*Math.cos(ph)*scl[0],r*Math.cos(th)*scl[1],r*Math.sin(th)*Math.sin(ph)*scl[2]]);}}
  for(let i=0;i<A;i++)for(let j=0;j<B;j++){const a0=i*B+j,a1=i*B+(j+1)%B,b0=(i+1)*B+j,b1=(i+1)*B+(j+1)%B;F.push([a0,a1,b1,b0]);}
  return {V,F};
}
function mergeHQ2(parts){const V=[],F=[];parts.forEach(({V:v,F:f,off=[0,0,0],col})=>{const base=V.length;v.forEach(p=>V.push([p[0]+off[0],p[1]+off[1],p[2]+off[2]]));f.forEach(fa=>{F.push({idx:fa.map(k=>k+base),col});});});
  let m=0;V.forEach(p=>m=Math.max(m,Math.abs(p[0]),Math.abs(p[1]),Math.abs(p[2])));const s=1.6/(m||1);
  return {V:V.map(p=>[p[0]*s,p[1]*s,p[2]*s]),F};}

  function setup(){const o=ORG[key];M=o.build();info.innerHTML=`<b style="font-size:1.15em">${o.emo} ${o.n}</b><p style="margin-top:8px;line-height:2.15">${o.desc}</p>`;}

        ctx.beginPath();o.idx.forEach((i,k)=>k?ctx.lineTo(P[i][0],P[i][1]):ctx.moveTo(P[i][0],P[i][1]));ctx.closePath();

        ctx.globalAlpha=0.15+0.25*shade;ctx.strokeStyle='#fff';ctx.lineWidth=0.6;ctx.stroke();ctx.globalAlpha=1;
      });
    }
    if(!drag)yaw+=0.008;requestAnimationFrame(draw);
  }
  cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yw:yaw,pt:pit};cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(drag){yaw=drag.yw+(e.clientX-drag.x)*0.012;pit=Math.max(-1.4,Math.min(1.4,drag.pt+(e.clientY-drag.y)*0.012));}};
  cv.onpointerup=()=>drag=null;
  renderTabs();setup();draw();
}

};

function btn(accent,icon,title,sub,fn){
  const b=document.createElement('button');b.className='cat-card';b.style.cssText='--accent:'+accent;
  b.innerHTML=`<span class="icon" style="font-size:22px">${icon}</span><div class="catbody"><b>${title}</b><small>${sub}</small></div>`;
  b.onclick=fn;return b;
}

function listScreen(root,title,sub,items,render,search){
  root.innerHTML=`<div class="panel"><div class="panel-title">${title}</div><div class="panel-sub">${sub}</div><input id="lsq" class="nb-search" placeholder="جست‌وجو…"><div id="lsl" style="margin-top:12px"></div></div>`;
  const L=$('#lsl',root);
  function draw(q){L.innerHTML=items.filter(x=>!q||search(x).includes(q)).map(render).join('')||'<div style="color:var(--ink-dim)">چیزی پیدا نشد.</div>';}
  draw('');$('#lsq',root).oninput=e=>draw(e.target.value.trim());
}

  function draw(){
    const a=loadMine();
    $('#mList',root).innerHTML=a.map((x,i)=>`<div class="nb-card"><b>${esc(x.t)}</b><p style="white-space:pre-wrap">${esc(x.v)}</p><button class="nb-del" data-i="${i}">حذف</button></div>`).join('')||'<div style="color:var(--ink-dim)">هنوز چیزی ذخیره نکرده‌ای.</div>';
    root.querySelectorAll('.nb-del').forEach(b=>b.onclick=()=>{const a=loadMine();a.splice(+b.dataset.i,1);saveMine(a);draw();});
  }
  $('#mAdd',root).onclick=()=>{
    const t=$('#mTitle',root).value.trim(),v=$('#mText',root).value.trim();
    if(!v)return;const a=loadMine();a.unshift({t:t||'بدون عنوان',v});saveMine(a);
    $('#mTitle',root).value='';$('#mText',root).value='';draw();
  };
  draw();
};
window.screenFaQuiz=function(root){
  let i=0,score=0;
  const order=FQ.map((_,k)=>k).sort(()=>Math.random()-.5);
  function show(){
    if(i>=order.length){
      root.innerHTML=`<div class="panel"><div class="panel-title">نتیجه</div><div class="panel-sub">امتیاز تو: ${fa(score)} از ${fa(FQ.length)}</div><button class="nb-quizbtn" id="again">دوباره</button></div>`;
      try{addXP(score*3)}catch(e){}
      $('#again',root).onclick=()=>window.screenFaQuiz(root);return;
    }
    const q=FQ[order[i]];
    const opts=[q[1],q[2],q[3]].map((t,k)=>({t,ok:k===0})).sort(()=>Math.random()-.5);
    root.innerHTML=`<div class="panel"><div class="panel-title">🧠 پرسش ${fa(i+1)} از ${fa(order.length)}</div><div class="panel-sub">${esc(q[0])}</div><div id="qo"></div></div>`;
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='nb-quizbtn';b.textContent=o.t;
      b.onclick=()=>{
        if(o.ok)score++;
        root.querySelectorAll('#qo button').forEach(x=>{x.disabled=true;});
        b.style.background=o.ok?'rgba(73,179,166,.35)':'rgba(193,81,125,.35)';
        setTimeout(()=>{i++;show();},700);
      };
      $('#qo',root).appendChild(b);
    });
  }
  show();
};

/* hook into the main home and the language home */
const faCard=()=>{const m=document.createElement('button');m.className='menu-card';m.id='goPersian';
  m.innerHTML='<span class="icon" style="font-size:30px">📜</span><b>فارسی</b><small>آرایه‌ها، دستور، حکایت‌ها، شاعران و آثار مشهور، آزمون</small>';
  m.onclick=()=>go(screenPersianHome);return m;};
if(typeof screenHome==='function'){
  const _sh=screenHome;
  screenHome=function(root){_sh(root);const g=root.querySelector('.menu-grid');if(g){const lang=g.querySelector('#goLang');const m=faCard();if(lang&&lang.nextSibling)g.insertBefore(m,lang.nextSibling);else g.appendChild(m);}};
}
if(typeof screenLanguageHome==='function'){
  const _sl=screenLanguageHome;

    _sl(root);
    const g=root.querySelector('.cat-grid');

  };
}
